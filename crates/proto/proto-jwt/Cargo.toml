[package]
name = "proto-jwt"
description = "OIDC bearer-token validation (JWT signature via cached JWKS, iss/aud/exp/nbf/scope) shared by the SBC's provisioning pod and SIP registrar. ES384 (P-384) only, per CNSA 2.0, via the aws-lc-rs FIPS module; RSA, ES256 and symmetric algorithms rejected. Design: docs/CLIENT-PROVISIONING-OIDC.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync"] }

# OIDC bearer-token validation (ES384 only, CNSA 2.0, via the aws-lc-rs
# backend).
jsonwebtoken.workspace = true
# Not called directly: enables aws-lc-rs `fips` for every binary that links
# proto-jwt, so jsonwebtoken's signature checks run in aws-lc-fips-sys (the
# FIPS module uc-crypto and rustls use) even where nothing else turns it on.
# NIST 800-53 Rev5: SC-13
aws-lc-rs = { workspace = true, features = ["fips"] }
# JWKS / OIDC-metadata fetch from the IdP. rustls only, no native-tls.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
# Test-only keypair generation (P-384, plus P-256/RSA to prove rejection)
# uses the aws-lc-rs dependency above; no static private key in the tree.
base64 = "0.22"
