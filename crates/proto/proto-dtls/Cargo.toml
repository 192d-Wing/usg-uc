[package]
name = "proto-dtls"
description = "DTLS implementation for secure media transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
uc-types.workspace = true
uc-crypto.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
bytes.workspace = true
zeroize.workspace = true

# Async support
async-trait = "0.1"

[dev-dependencies]
# Real self-signed certificates for the fingerprint-binding tests.
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs"] }
# Loopback test: protect/unprotect RTP with the keys the association exports.
proto-srtp.workspace = true
proto-rtp.workspace = true
# Property tests: codecs, arbitrary input in every state, and arbitrary
# fragmentation / reordering / duplication / loss of a real handshake.
proptest.workspace = true

[features]
# Test-only: proto-dtls's OWN unit tests use random local keys instead of
# failing closed. The placeholder is compiled only under `cfg(test)`, so
# feature unification (e.g. workspace `--all-features`) never puts it into a
# dependent crate; release builds with the feature fail to compile
# (POA&M-324).
test-placeholder-keying = []

[lints]
workspace = true
