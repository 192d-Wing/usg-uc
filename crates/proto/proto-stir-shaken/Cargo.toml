[package]
name = "proto-stir-shaken"
description = "STIR/SHAKEN caller ID verification and attestation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# Pure and synchronous: no network, file or crypto dependencies. Signing and
# signature verification are injected through the `Signer` / `VerifyingKey`
# traits (implemented in `uc-sti` on top of `uc-crypto`).
[dependencies]
uc-types.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"

[dev-dependencies]
proptest = { version = "1.6", default-features = false, features = ["std"] }
