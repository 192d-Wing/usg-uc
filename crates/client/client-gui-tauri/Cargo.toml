[package]
name = "client-gui-tauri"
version = "0.1.0"
edition = "2021"
description = "USG SIP Soft Client - Modern Tauri-based GUI"

[features]
default = []
# UDP/TCP SIP transports for lab testing; default builds are TLS-only.
insecure-transports = ["client-core/insecure-transports"]
digest-auth = ["client-core/digest-auth", "client-types/digest-auth"]

[dependencies]
# Tauri for desktop app framework
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Client core and types. OIDC sign-in (discovery + browser PKCE +
# keychain-persisted refresh token) ships on by default.
client-types = { path = "../client-types" }
client-core = { path = "../client-core", features = ["oidc"] }
client-audio = { path = "../client-audio" }
client-provisioning = { path = "../client-provisioning" }

# Async runtime
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Token/secret handling for the OIDC session.
zeroize = { workspace = true }
chrono = { workspace = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

[[bin]]
name = "sip-softclient"
path = "src/main.rs"
