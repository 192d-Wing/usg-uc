[package]
name = "client-core"
description = "Application core for USG SIP Soft Client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# UDP/TCP SIP transports, for lab and commercial-provider testing.
# Default builds are TLS-only: accounts with a UDP or TCP transport
# preference are rejected at registration time.
insecure-transports = ["client-audio/insecure-rtp"]
# Digest authentication with optional credential persistence. Implies
# insecure-transports (the digest test providers are UDP).
digest-auth = [
    "client-types/digest-auth",
    "client-sip-ua/digest-auth",
    "insecure-transports",
    "keyring",
    "uc-crypto",
    "hostname",
    "whoami",
]
# OIDC sign-in support: persists the refresh token in the OS keychain
# (CredentialStore) without pulling in the digest-auth code paths.
oidc = [
    "keyring",
    "uc-crypto",
    "hostname",
    "whoami",
]

# Test seams (`CallManager::set_audio_devices_enabled`). Enabled only by
# this crate's own dev-dependency on itself, that is, when its integration
# tests are built. No other crate may enable it; default and release
# builds do not contain the seam.
# NIST 800-53 Rev5: CM-7 (least functionality).
test-util = []

[dependencies]
client-types = { path = "../client-types" }
client-sip-ua = { path = "../client-sip-ua" }
client-audio = { path = "../client-audio" }
proto-sip.workspace = true
proto-ice.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
zeroize.workspace = true
bytes.workspace = true

# TLS support
rustls.workspace = true
tokio-rustls = "0.26"
rustls-pki-types.workspace = true
rustls-native-certs.workspace = true
# Shared CNSA 2.0 rustls CryptoProvider (uc_transport::tls::cnsa_provider).
uc-transport.workspace = true

# Utilities
base64 = "0.22"

# Platform utilities
directories.workspace = true

# Secure credential storage (optional)
# Note: Platform-specific features are enabled via target-specific dependencies below
uc-crypto = { path = "../../uc/uc-crypto", optional = true }
hostname = { version = "0.4", optional = true }
whoami = { version = "1.6", optional = true }

# Windows smart card/PKI support + keyring with native backend
[target.'cfg(windows)'.dependencies]
windows.workspace = true
keyring = { version = "3", features = ["windows-native"], optional = true }

# macOS keychain/security support + keyring with native backend
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
keyring = { version = "3", features = ["apple-native"], optional = true }

# Linux keyring with native backend (using Secret Service)
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"], optional = true }

# PKCS#11 for cross-platform smart card support (YubiKey, etc.)
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
cryptoki = "0.12"

[dev-dependencies]
# Turns on the `test-util` seam for this crate's integration tests only
# (dev-dependencies are not part of a normal build of the library).
client-core = { path = ".", features = ["test-util"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile.workspace = true
# Captures log records in the media-security tests (call_manager.rs).
tracing-subscriber.workspace = true
# In-process DTLS peer and SRTP checks for the DTLS-SRTP call tests, and the
# pion interop test (tests/dtls_srtp_call.rs, tests/dtls_interop_pion.rs).
proto-dtls.workspace = true
proto-srtp.workspace = true
proto-rtp.workspace = true
uc-crypto.workspace = true
# The proto-dtls test harness these tests include by path builds its test
# identities with rcgen (same spec as client-sip-ua).
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs"] }

[lints]
workspace = true
