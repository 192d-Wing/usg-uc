[package]
name = "client-audio"
description = "Audio pipeline for USG SIP Soft Client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Enable Opus FFI codec (requires libopus: brew install opus)
opus-ffi = ["uc-codecs/opus-ffi"]

[dependencies]
client-types = { path = "../client-types" }
uc-codecs.workspace = true
proto-rtp.workspace = true
proto-srtp.workspace = true
thiserror.workspace = true
tracing.workspace = true
bytes.workspace = true

# Audio
cpal.workspace = true
ringbuf.workspace = true

# WAV file loading for Music on Hold
hound = "3.5"

# Apple Voice Processing I/O (hardware AEC).
# macOS: capture-only VPIO (see `vpio.rs`). iOS: duplex VPIO/RemoteIO unit
# (capture + playback through one unit, see `ios_vpio.rs`). coreaudio-rs/
# coreaudio-sys support both via the AudioToolbox framework.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
coreaudio-rs = "0.13"

# Android low-latency audio. The `oboe` crate (oboe-rs) bundles Google's Oboe
# C++ library and builds it from source via the NDK (cc crate, C++17), selecting
# AAudio (API 26+) or OpenSL ES at runtime. See `android_oboe.rs`.
[target.'cfg(target_os = "android")'.dependencies]
oboe = "0.6"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
criterion.workspace = true

[[bench]]
name = "audio_hotpaths"
harness = false

[lints]
workspace = true
