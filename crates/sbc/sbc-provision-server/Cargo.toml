[package]
name = "sbc-provision-server"
description = "Stand-alone phone-provisioning HTTP pod for the USG SBC. Serves /provision/<MAC>.{cfg,xml} by looking up the phone record in Postgres (via sbc-config-store::PostgresPhoneStore) and rendering the vendor-specific config through uc_phone_mgmt::ProvisioningServer. Lives in its own pod so phone provisioning rolls independently of the SIP-serving daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "sbc-provision-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sbc-config-store = { workspace = true }
uc-phone-mgmt.workspace = true

tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing.workspace = true
# `json` enables structured JSON log output (we call `.json()` in main.rs).
# Workspace's tracing-subscriber declaration only has `env-filter`.
tracing-subscriber = { workspace = true, features = ["json"] }

axum.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["trace"] }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror.workspace = true
ipnet = "2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
