[package]
name = "central-config-import"
description = "One-shot importer: read an existing site-local config Postgres and load it into that site's shard of the central config database. Onboards a base into central-config (docs/CENTRAL-CONFIG-PLAN.md Phase 1/4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[[bin]]
name = "central-config-import"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror.workspace = true
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
central-config-store = { path = "../central-config-store" }
# Not referenced in code: feature unification only. The workspace rustls
# entry enables `fips`, so sqlx's rustls TLS runs on the aws-lc FIPS module
# (NIST 800-53 Rev5: SC-13).
rustls.workspace = true

[dev-dependencies]
sbc-config-store = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# SR-16 FIPS posture test. Not `workspace = true` on purpose: the workspace
# entry enables `fips`, which would mask the binary's own FIPS posture.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
