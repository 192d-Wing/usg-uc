[package]
name = "central-config-import"
description = "One-shot importer: read an existing site-local config Postgres and load it into that site's shard of the central config database. Onboards a base into central-config (docs/CENTRAL-CONFIG-PLAN.md Phase 1/4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[[bin]]
name = "central-config-import"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror.workspace = true
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
central-config-store = { path = "../central-config-store" }

[dev-dependencies]
sbc-config-store = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
