[package]
name = "sbc-api-server"
description = "Stand-alone SBC API server pod. Hosts the operator REST surface for config entities (phones, DIDs, trunk groups, dial plans) directly out of Postgres, and proxies SIP-state reads to the sbc-daemon. Pairs with the daemon's TrunkSync/DialPlanSync/DidMappingSync gRPC services for SIP-router invalidation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "sbc-api-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Shared SBC pieces
sbc-config-store = { workspace = true }
sbc-grpc-api = { workspace = true }
# Trusted-proxy-aware client-IP resolution (shared with sbc-provision-server).
sbc-http-util = { workspace = true }
uc-auth = { workspace = true }
# OIDC bearer validation so operators authenticate once (the same
# config-admin tokens the central config API accepts).
proto-jwt = { workspace = true }
uc-phone-mgmt.workspace = true
# Users move into sbc-api as of PR10. We use the Postgres backend
# directly (no sqlite/dispatch shim) — sbc-api always runs against
# the same shared Postgres as the daemon's other config stores.
# Direct path dep (instead of workspace=true) so we can disable the
# default `sqlite` feature; cargo doesn't allow overriding inherited
# default-features.
uc-user-mgmt = { path = "../../uc/uc-user-mgmt", default-features = false, features = ["postgres", "encryption"] }
# HA1-at-rest key (AES-256-GCM via uc-crypto, CNSA 2.0).
uc-crypto.workspace = true
zeroize.workspace = true

# Runtime
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing.workspace = true
# `json` enables structured JSON log output (we call `.json()` in main.rs).
# Workspace's tracing-subscriber declaration only has `env-filter`.
tracing-subscriber = { workspace = true, features = ["json"] }

# HTTP server
axum.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["trace"] }
hyper.workspace = true

# Serde
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# gRPC client to the daemon's TrunkSync/DialPlanSync/DidMappingSync.
tonic = { workspace = true }

# HTTP reverse-proxy fallback. Anything sbc-api doesn't own a handler
# for (partitions, CSS, route patterns/lists, CDRs, dial-plan reads)
# gets proxied to the daemon's still-running REST endpoint. No bundled
# crypto provider: TLS is the CNSA config from uc-transport `https-client`.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-no-provider"] }
uc-transport = { workspace = true, default-features = false, features = ["https-client"] }

# CDR schema v1 formatting (JSONL/CSV export) and the CdrExport audit event.
uc-cdr.workspace = true
uc-audit.workspace = true

uuid = { version = "1", features = ["v4"] }
thiserror.workspace = true
ipnet.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "user"] }

[dev-dependencies]
# Paused clock for the login lockout window tests.
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
uc-user-mgmt = { path = "../../uc/uc-user-mgmt", default-features = false, features = ["postgres", "encryption", "sqlite"] }
uc-audit = { workspace = true, features = ["test-capture"] }
# Router-level OIDC tests: mint ES384 tokens against a static JWKS.
jsonwebtoken.workspace = true
aws-lc-rs = { workspace = true, default-features = false, features = ["aws-lc-sys"] }
base64 = "0.22"
# SR-16 HTTPS client tests (uc-transport/tests/common/cnsa_*.rs): random
# P-384 PKI + in-process TLS server. rustls is not `workspace = true` on
# purpose: the workspace entry enables `fips`, which would mask the
# binary's own FIPS posture in tests.
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls.workspace = true
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
