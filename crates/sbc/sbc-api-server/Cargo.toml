[package]
name = "sbc-api-server"
description = "Stand-alone SBC API server pod. Hosts the operator REST surface for config entities (phones, DIDs, trunk groups, dial plans) directly out of Postgres, and proxies SIP-state reads to the sbc-daemon. Pairs with the daemon's TrunkSync/DialPlanSync/DidMappingSync gRPC services for SIP-router invalidation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "sbc-api-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Shared SBC pieces
sbc-config-store = { workspace = true }
sbc-grpc-api = { workspace = true }
# Trusted-proxy-aware client-IP resolution (shared with sbc-provision-server).
sbc-http-util = { workspace = true }
uc-auth = { workspace = true }
# OIDC bearer validation so operators authenticate once (the same
# config-admin tokens the central config API accepts).
proto-jwt = { workspace = true }
uc-phone-mgmt.workspace = true
# Users move into sbc-api as of PR10. We use the Postgres backend
# directly (no sqlite/dispatch shim) — sbc-api always runs against
# the same shared Postgres as the daemon's other config stores.
# Direct path dep (instead of workspace=true) so we can disable the
# default `sqlite` feature; cargo doesn't allow overriding inherited
# default-features.
uc-user-mgmt = { path = "../../uc/uc-user-mgmt", default-features = false, features = ["postgres"] }

# Runtime
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing.workspace = true
# `json` enables structured JSON log output (we call `.json()` in main.rs).
# Workspace's tracing-subscriber declaration only has `env-filter`.
tracing-subscriber = { workspace = true, features = ["json"] }

# HTTP server
axum.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["trace"] }
hyper.workspace = true

# Serde
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# gRPC client to the daemon's TrunkSync/DialPlanSync/DidMappingSync.
tonic = { workspace = true }

# HTTP reverse-proxy fallback. Anything sbc-api doesn't own a handler
# for (partitions, CSS, route patterns/lists, CDRs, dial-plan reads)
# gets proxied to the daemon's still-running REST endpoint.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

uuid = { version = "1", features = ["v4"] }
thiserror.workspace = true
ipnet.workspace = true
