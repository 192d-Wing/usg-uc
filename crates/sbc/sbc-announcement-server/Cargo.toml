[package]
name = "sbc-announcement-server"
description = "Announcement playback pod for the USG SBC. Hosts the gRPC AnnouncementService: the daemon asks it to play a pre-recorded PCMU announcement (number-not-in-service, all-circuits-busy) toward a caller's RTP address; the pod binds the RTP socket, reports the advertised IP/port for the daemon's 200 OK SDP, streams the audio, and reports completion so the daemon can send BYE."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "sbc-announcement-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }

tonic.workspace = true
# `mtls`: the shared listener rule and client-name gate (as sbc-media).
sbc-grpc-api = { workspace = true, features = ["mtls"] }
sbc-announcement.workspace = true
# Media CIDR allow-list (SBC_ANN_ALLOWED_DEST_CIDRS).
ipnet.workspace = true
# Process-level CryptoProvider selection (aws-lc, as the daemon).
rustls.workspace = true

rand = "0.8"

[dev-dependencies]
# SR-41 QA: P-384 test PKI for the in-process mTLS handshake tests.
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile.workspace = true
