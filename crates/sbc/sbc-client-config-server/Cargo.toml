[package]
name = "sbc-client-config-server"
description = "Soft-client discovery + provisioning HTTP pod for the USG SBC. Serves /.well-known/sip-client-config (anycast discovery document pointing clients at the IdP) and /v1/client-config (per-user SIP configuration: DN, SIP URI, POP-scoped registrar domain), authorizing requests with OIDC bearer tokens validated against the IdP's JWKS. Design: docs/CLIENT-PROVISIONING-OIDC.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "sbc-client-config-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing.workspace = true
# `json` enables structured JSON log output (we call `.json()` in main.rs).
tracing-subscriber = { workspace = true, features = ["json"] }

axum.workspace = true
tower-http = { workspace = true, features = ["trace"] }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror.workspace = true

# OIDC bearer-token validation (JWKS cache + JWT validator), shared with the
# SIP registrar so both authorize the same tokens identically.
proto-jwt.workspace = true
# Building the HTTP client (rustls, optional extra CA) the JWKS cache fetches
# with. No bundled crypto provider: TLS is the CNSA config from uc-transport
# `https-client`, which also links the FIPS module (workspace rustls `fips`).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-no-provider"] }
uc-transport = { workspace = true, default-features = false, features = ["https-client"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
# Test-only token signing: ES256 keypair generation + JWT encode. No static
# private key in the tree.
jsonwebtoken.workspace = true
aws-lc-rs = { workspace = true, default-features = false, features = ["aws-lc-sys"] }
base64 = "0.22"
# SR-16 HTTPS client tests (uc-transport/tests/common/cnsa_*.rs): random
# P-384 PKI + in-process TLS server. rustls is not `workspace = true` on
# purpose: the workspace entry enables `fips`, which would mask the
# binary's own FIPS posture in tests.
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls.workspace = true
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
