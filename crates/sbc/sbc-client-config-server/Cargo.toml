[package]
name = "sbc-client-config-server"
description = "Soft-client discovery + provisioning HTTP pod for the USG SBC. Serves /.well-known/sip-client-config (anycast discovery document pointing clients at the IdP) and /v1/client-config (per-user SIP configuration: DN, SIP URI, POP-scoped registrar domain), authorizing requests with OIDC bearer tokens validated against the IdP's JWKS. Design: docs/CLIENT-PROVISIONING-OIDC.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "sbc-client-config-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing.workspace = true
# `json` enables structured JSON log output (we call `.json()` in main.rs).
tracing-subscriber = { workspace = true, features = ["json"] }

axum.workspace = true
tower-http = { workspace = true, features = ["trace"] }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror.workspace = true

# OIDC bearer-token validation (RS256/PS256/ES256/ES384 via the aws-lc-rs
# backend — same FIPS crypto module the rest of the workspace links).
jsonwebtoken.workspace = true
# JWKS / OIDC-metadata fetch from the IdP. rustls only, no native-tls.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
# Test-only ES256 keypair generation — no static private key in the tree.
aws-lc-rs = { workspace = true, default-features = false, features = ["aws-lc-sys"] }
base64 = "0.22"
