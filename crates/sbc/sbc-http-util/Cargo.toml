[package]
name = "sbc-http-util"
description = "Small shared HTTP helpers for the USG SBC front-facing pods (sbc-api-server, sbc-provision-server, central-config-api): trusted-proxy-aware client-IP resolution and management-plane audit records."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
http.workspace = true
ipnet.workspace = true
# Management-plane audit records (mgmt_audit, SR-40).
uc-audit.workspace = true

[dev-dependencies]
# Thread-local capture of audit records (SR-40 mgmt_audit tests).
uc-audit = { workspace = true, features = ["test-capture"] }
