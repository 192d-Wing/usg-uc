[package]
name = "uc-storage"
description = "Storage backends for USG SBC state persistence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
redis = ["dep:redis", "dep:bb8"]
postgres = ["dep:sqlx", "dep:chrono"]

[dependencies]
# Async runtime
tokio.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Logging
tracing.workspace = true

# Error handling
thiserror.workspace = true

# Bytes handling
bytes.workspace = true

# Redis (optional)
# `tokio-rustls-comp` enables rediss:// (rustls with the process-default
# provider, aws-lc-rs in this workspace). `tls-rustls-insecure` is
# deliberately NOT enabled. bb8-redis is replaced by a local manager so the
# client can carry a custom CA / client certificate.
redis = { version = "1.7", features = ["tokio-comp", "cluster-async", "tokio-rustls-comp"], optional = true }
bb8 = { version = "0.9", optional = true }

# PostgreSQL (optional)
# `tls-rustls-aws-lc-rs`: sqlx builds its own rustls ClientConfig with the
# aws-lc-rs default provider (suites not CNSA-pinned; POA&M-230).
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "tls-rustls-aws-lc-rs"], optional = true }
chrono = { version = "0.4", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
