[package]
name = "uc-sti"
description = "STIR/SHAKEN services: STI certificate fetch/cache, trust anchors, attestation policy, signing key"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
proto-stir-shaken.workspace = true
# CNSA-EXCEPTION: ATIS-1000074 mandates ES256 (P-256) for SHAKEN PASSporTs.
uc-crypto = { workspace = true, features = ["stir-shaken-es256"] }
uc-types.workspace = true
# CNSA 2.0 rustls provider for the x5u fetch client (POA&M-40).
uc-transport = { workspace = true, features = ["tls"] }
tokio = { workspace = true, features = ["net", "time", "sync", "rt", "fs"] }
tokio-rustls.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
rustls-native-certs.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util.workspace = true
http.workspace = true
http-body-util.workspace = true
bytes.workspace = true
arc-swap = "1.7"
tracing.workspace = true
thiserror.workspace = true
zeroize.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW for the signing-key open (no unsafe in this crate).
nix = { workspace = true, features = ["fs", "user"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
