---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kea-leases
  namespace: sbc-system
  labels:
    app.kubernetes.io/name: kea-dhcp4
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kea-dhcp4
  namespace: sbc-system
  labels:
    app.kubernetes.io/name: kea-dhcp4
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kea-dhcp4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kea-dhcp4
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [
            {"name": "kea-phones", "interface": "net1"}
          ]
    spec:
      serviceAccountName: kea-dhcp4
      terminationGracePeriodSeconds: 30
      containers:
        - name: kea-dhcp4
          image: docker.io/jonasal/kea-dhcp4:2.6.1
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/kea/kea-dhcp4.conf"]
          securityContext:
            # Kea needs raw sockets to receive DHCP broadcasts before
            # the client has an IP, plus the DHCP server port (UDP/67).
            capabilities:
              drop: ["ALL"]
              add: ["NET_RAW", "NET_BIND_SERVICE", "NET_ADMIN"]
            readOnlyRootFilesystem: false
          ports:
            - name: dhcp-server
              containerPort: 67
              protocol: UDP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/kea/kea-dhcp4.conf
              subPath: kea-dhcp4.conf
              readOnly: true
            - name: leases
              mountPath: /var/lib/kea
            - name: runtime
              mountPath: /usr/local/var/run/kea
      volumes:
        - name: config
          configMap:
            name: kea-dhcp4-config
        - name: leases
          persistentVolumeClaim:
            claimName: kea-leases
        - name: runtime
          emptyDir: {}
