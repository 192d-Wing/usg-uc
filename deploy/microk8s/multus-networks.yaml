# NetworkAttachmentDefinitions
#
# SBC zones (inside / outside / oobm) all live on VLAN 3000 via macvlan
# rooted at the host VLAN sub-interface `ens192.3000`.
#
# Kea DHCP for TEO phones lives on VLAN 3001 via macvlan rooted at
# `ens192.3001` (created at host boot — see deploy/microk8s/README.md).
---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: sbc-inside
  namespace: sbc-system
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "ens192.3000",
      "mode": "bridge",
      "ipam": {
        "type": "host-local",
        "subnet": "10.0.100.0/24",
        "rangeStart": "10.0.100.240",
        "rangeEnd": "10.0.100.240",
        "gateway": "10.0.100.1"
      }
    }
---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: sbc-outside
  namespace: sbc-system
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "ens192.3000",
      "mode": "bridge",
      "ipam": {
        "type": "host-local",
        "subnet": "10.0.100.0/24",
        "rangeStart": "10.0.100.241",
        "rangeEnd": "10.0.100.241",
        "gateway": "10.0.100.1"
      }
    }
---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: sbc-oobm
  namespace: sbc-system
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "ens192.3000",
      "mode": "bridge",
      "ipam": {
        "type": "host-local",
        "subnet": "10.0.100.0/24",
        "rangeStart": "10.0.100.242",
        "rangeEnd": "10.0.100.242",
        "gateway": "10.0.100.1"
      }
    }
---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: kea-phones
  namespace: sbc-system
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "ens192.3001",
      "mode": "bridge",
      "ipam": {
        "type": "host-local",
        "subnet": "10.0.101.0/24",
        "rangeStart": "10.0.101.2",
        "rangeEnd": "10.0.101.2",
        "gateway": "10.0.101.1"
      }
    }
