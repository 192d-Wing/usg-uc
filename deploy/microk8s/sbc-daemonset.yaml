apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sbc-daemon
  namespace: sbc-system
  labels:
    app.kubernetes.io/name: sbc
    app.kubernetes.io/component: daemon
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sbc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sbc
        app.kubernetes.io/component: daemon
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [
            {"name": "sbc-inside",  "interface": "net1"},
            {"name": "sbc-outside", "interface": "net2"},
            {"name": "sbc-oobm",    "interface": "net3"}
          ]
    spec:
      serviceAccountName: sbc-daemon
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: route-setup
          image: busybox:1.36
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
          command: ["sh", "-c"]
          env:
            - name: LAN_SUBNET
              valueFrom:
                configMapKeyRef:
                  name: sbc-network
                  key: lan_subnet
            - name: LAN_GATEWAY
              valueFrom:
                configMapKeyRef:
                  name: sbc-network
                  key: lan_gateway
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          args:
            - |
              set -e
              # Three macvlan zones share one LAN subnet, so the pod's main
              # table has three competing on-link routes for 10.0.100.0/24.
              # The kernel always picks the first (net1) for any LAN
              # destination, so a SYN-ACK leaving the pod for a connection
              # accepted on net2/net3 egresses through net1 with the wrong
              # MAC. Per-source routing tables keep the egress symmetric.
              for entry in "240:net1:inside" "241:net2:outside" "242:net3:oobm"; do
                last_octet=$(echo "$entry" | cut -d: -f1)
                dev=$(echo "$entry" | cut -d: -f2)
                table="$last_octet"
                src_ip="10.0.100.${last_octet}"
                ip route flush table "$table" 2>/dev/null || true
                ip route add 10.0.100.0/24 dev "$dev" scope link src "$src_ip" table "$table"
                ip route add default via "$LAN_GATEWAY" dev "$dev" table "$table"
                ip rule add from "$src_ip" table "$table" priority "$((1000 + last_octet))" || true
                echo "Pinned src $src_ip -> $dev (table $table)"
              done
              # Pin the kubelet host IP back via calico/eth0 so HTTP probes
              # (originating from the host on $LAN_SUBNET) get symmetric
              # replies. Without this, replies leak out a macvlan interface.
              CALICO_GW=$(ip -4 route show default | awk '/dev eth0/ {print $3; exit}')
              if [ -n "$HOST_IP" ] && [ -n "$CALICO_GW" ]; then
                ip route replace "$HOST_IP/32" via "$CALICO_GW" dev eth0
                echo "Pinned host IP $HOST_IP via $CALICO_GW dev eth0"
              fi
              chown -R 1000:1000 /var/lib/sbc 2>/dev/null || true
          volumeMounts:
            - name: data
              mountPath: /var/lib/sbc
      containers:
        - name: sbc
          # NOTE: image must be present in microk8s containerd.
          # Build externally and import with:
          #   microk8s ctr image import sbc-daemon.tar
          image: sbc-daemon:local
          imagePullPolicy: Never
          args: ["-c", "/etc/sbc/config.toml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          ports:
            - name: sip-udp
              containerPort: 5060
              protocol: UDP
            - name: sip-tcp
              containerPort: 5060
              protocol: TCP
            - name: sip-tls
              containerPort: 5061
              protocol: TCP
            - name: api
              containerPort: 80
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/sbc/config.toml
              subPath: config.toml
              readOnly: true
            - name: data
              mountPath: /var/lib/sbc
            - name: logs
              mountPath: /var/log/sbc
      volumes:
        - name: config
          configMap:
            name: sbc-config
        - name: data
          hostPath:
            path: /var/lib/sbc
            type: DirectoryOrCreate
        - name: logs
          emptyDir: {}
