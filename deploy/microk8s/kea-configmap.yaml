apiVersion: v1
kind: ConfigMap
metadata:
  name: kea-dhcp4-config
  namespace: sbc-system
  labels:
    app.kubernetes.io/name: kea-dhcp4
data:
  # ISC Kea DHCPv4 config for the TEO phone VLAN (3001).
  # Phones receive option 66 / 67 / 160 pointing at the SBC's HTTP
  # provisioning endpoint, served by crates/uc/uc-phone-mgmt teo.rs.
  kea-dhcp4.conf: |
    {
      "Dhcp4": {
        "interfaces-config": {
          "interfaces": ["net1"],
          "dhcp-socket-type": "raw"
        },
        "control-socket": {
          "socket-type": "unix",
          "socket-name": "/tmp/kea4-ctrl-socket"
        },
        "lease-database": {
          "type": "memfile",
          "persist": true,
          "name": "/var/lib/kea/kea-leases4.csv",
          "lfc-interval": 3600
        },
        "expired-leases-processing": {
          "reclaim-timer-wait-time": 10,
          "flush-reclaimed-timer-wait-time": 25,
          "hold-reclaimed-time": 3600,
          "max-reclaim-leases": 100,
          "max-reclaim-time": 250,
          "unwarned-reclaim-cycles": 5
        },
        "renew-timer": 900,
        "rebind-timer": 1800,
        "valid-lifetime": 3600,
        "option-def": [
          {
            "name": "v4-firmware-url",
            "code": 160,
            "type": "string",
            "space": "dhcp4"
          },
          {
            "name": "tftp-server-address",
            "code": 150,
            "type": "ipv4-address",
            "array": true,
            "space": "dhcp4"
          }
        ],
        "option-data": [
          { "name": "tftp-server-name",    "data": "sbc.xtic.dev.mil" },
          { "name": "tftp-server-address", "data": "10.0.100.240" },
          { "name": "boot-file-name",      "data": "provision" },
          { "name": "v4-firmware-url",     "data": "http://sbc.xtic.dev.mil/provision" }
        ],
        "subnet4": [
          {
            "id": 1,
            "subnet": "10.0.101.0/24",
            "interface": "net1",
            "pools": [
              { "pool": "10.0.101.100 - 10.0.101.200" }
            ],
            "option-data": [
              { "name": "routers",              "data": "10.0.101.1" },
              { "name": "domain-name-servers",  "data": "10.0.101.1" },
              { "name": "tftp-server-name",     "data": "sbc.xtic.dev.mil" },
              { "name": "tftp-server-address",  "data": "10.0.100.240" },
              { "name": "boot-file-name",       "data": "provision" },
              { "name": "v4-firmware-url",      "data": "http://sbc.xtic.dev.mil/provision" }
            ]
          }
        ],
        "loggers": [
          {
            "name": "kea-dhcp4",
            "output_options": [{ "output": "stdout" }],
            "severity": "INFO"
          }
        ]
      }
    }
