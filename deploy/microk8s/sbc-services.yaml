# SBC Services — macvlan IPs are the real external entrypoints (direct LAN).
# These ClusterIP Services exist for in-cluster discovery only.
---
apiVersion: v1
kind: Service
metadata:
  name: sbc-signaling
  namespace: sbc-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sbc
  ports:
    - name: sip-udp
      port: 5060
      targetPort: 5060
      protocol: UDP
    - name: sip-tcp
      port: 5060
      targetPort: 5060
      protocol: TCP
    - name: sip-tls
      port: 5061
      targetPort: 5061
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: sbc-oobm
  namespace: sbc-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sbc
  ports:
    - name: api
      port: 80
      targetPort: 80
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
