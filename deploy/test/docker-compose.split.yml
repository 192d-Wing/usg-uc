# USG SBC Stress Test Environment — Split signaling/media (co-located)
#
# The Phase-2 signaling↔media split: sbc-daemon runs signaling-only and drives
# a separate sbc-media process over gRPC, instead of relaying in-process.
#
# Topology (co-located): sbc-media shares sbc-signaling's network namespace
# (network_mode: service:sbc-signaling), so:
#   - the gRPC control plane is loopback (http://127.0.0.1:9096);
#   - sbc-media binds RTP on the SAME media IP (172.28.2.10) the daemon already
#     advertises in SDP — no SDP media-address steering needed (that is Phase 3,
#     for a standalone media-node pool with distinct IPs).
# This mirrors a two-container Kubernetes pod (shared pod network).
#
# The daemon retries the gRPC connect at startup, so ordering is not fragile:
# sbc-signaling comes up first (owns the namespace) and retries until sbc-media
# (which joins the namespace) is listening.
#
# Usage:
#   docker compose -f deploy/test/docker-compose.split.yml up --build
#
# This is the split-topology counterpart of docker-compose.yml (the monolith).

services:
  # ── SBC signaling plane (SIP only; media is remote) ────────────
  sbc-signaling:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: usg-sbc-split:test
    container_name: sbc-signaling
    environment:
      # Drive the out-of-process media plane over the shared-namespace loopback.
      SBC_MEDIA_CONTROLLER_URL: "http://127.0.0.1:9096"
    ports:
      - "5060:5060/udp"        # SIP signaling
      - "5060:5060/tcp"
      - "8080:8080/tcp"        # REST API
      - "16384-16484:16384-16484/udp"  # RTP media (served by sbc-media in-ns)
    volumes:
      - ./sbc-test.toml:/etc/sbc/config.toml:ro
    networks:
      sbc-signaling:
        ipv4_address: 172.28.1.10
      sbc-media:
        ipv4_address: 172.28.2.10
    healthcheck:
      # Healthy only after wire_remote_media connects sbc-media and start() runs.
      test: ["CMD", "/usr/local/bin/sbc-cli", "health", "--quiet"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 20s

  # ── SBC media plane (RTP/SRTP relay pod) ───────────────────────
  sbc-media:
    image: usg-sbc-split:test
    container_name: sbc-media
    # Share the signaling container's network namespace: loopback gRPC + the
    # same media IP the daemon advertises. Ports/networks are owned by
    # sbc-signaling above.
    network_mode: "service:sbc-signaling"
    entrypoint: ["/usr/local/bin/sbc-media"]
    environment:
      SBC_MEDIA_GRPC_LISTEN: "127.0.0.1:9096"
      SBC_MEDIA_RTP_PORT_MIN: "16384"
      SBC_MEDIA_RTP_PORT_MAX: "16484"
      SBC_MEDIA_DEFAULT_MODE: "relay"
      # SIPp drives plain RTP (no DTLS-SRTP), matching the monolith audio gate.
      SBC_MEDIA_SRTP_REQUIRED: "false"
    depends_on:
      sbc-signaling:
        condition: service_started

  # ── SIPp UAS (answers calls) ───────────────────────────────────
  sipp-uas:
    image: ctaloi/sipp:latest
    container_name: sipp-uas
    command: >
      -sn uas
      -p 5080
      -mi 172.28.2.20
      -rtp_echo
      -trace_err
      -fd 1s
    networks:
      sbc-signaling:
        ipv4_address: 172.28.1.20
      sbc-media:
        ipv4_address: 172.28.2.20
    depends_on:
      sbc-signaling:
        condition: service_healthy

  # ── SIPp UAC (generates load) ──────────────────────────────────
  sipp-uac:
    image: ctaloi/sipp:latest
    container_name: sipp-uac
    volumes:
      - ./:/scenarios:ro
    cap_add:
      - NET_RAW
    command: >
      172.28.1.10:5060
      -sn uac
      -r 10
      -rp 1000
      -l 100
      -m 1000
      -mi 172.28.2.30
      -p 5070
      -trace_err
      -trace_stat
      -fd 1s
      -d 5000
      -recv_timeout 10000
    networks:
      sbc-signaling:
        ipv4_address: 172.28.1.30
      sbc-media:
        ipv4_address: 172.28.2.30
    depends_on:
      sbc-signaling:
        condition: service_healthy
      sipp-uas:
        condition: service_started

networks:
  sbc-signaling:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24
  sbc-media:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.2.0/24
