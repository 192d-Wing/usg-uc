# SBC test configuration — SPLIT signaling/media topology (deploy/test).
#
# Counterpart of sbc-test.toml for docker-compose.split.yml. The media plane
# runs in a SEPARATE container (sbc-media) at 172.28.2.11, so:
#   - the daemon runs signaling-only (SBC_MEDIA_CONTROLLER_URL drives sbc-media);
#   - the zone media_interface / external_ip advertise sbc-media's IP
#     (172.28.2.11) in SDP, so callers send RTP to sbc-media's relay. The daemon
#     never binds this IP (in remote mode it has no in-process media pipeline;
#     the zone media IP is advertisement-only for literal-IP zones).
#
# Topology:
#   signaling net (172.28.1.0/24): daemon 172.28.1.10, UAS .20, UAC .30
#   media net     (172.28.2.0/24): daemon 172.28.2.10, sbc-media 172.28.2.11,
#                                   UAS .20, UAC .30

[general]
instance_name = "sbc-test-split"
max_calls = 5000
max_registrations = 10000
default_internal_zone = "signaling"

# ── Zones: media_interface / external_ip point at the sbc-media pod ──

[[zones]]
name = "signaling"
signaling_interface = "172.28.1.10"
media_interface = "172.28.2.11"
external_ip = "172.28.2.11"

[[zones]]
name = "media"
signaling_interface = "172.28.1.10"
media_interface = "172.28.2.11"
external_ip = "172.28.2.11"

[[zones]]
name = "oobm"
signaling_interface = "172.28.1.10"
media_interface = "172.28.2.11"
external_ip = "172.28.2.11"

# ── Transport (bind all interfaces so the container is reachable) ──

[transport]
udp_listen = ["0.0.0.0:5060"]
tcp_listen = ["0.0.0.0:5060"]
tls_listen = ["0.0.0.0:5061"]
api_listen = "0.0.0.0:8080"
tcp_timeout_secs = 30
tcp_idle_timeout_secs = 300

# ── Media: port range matches sbc-media's SBC_MEDIA_RTP_PORT_* + the compose
# port mapping on sbc-media. In remote mode the daemon does not bind these; the
# range is advertised to callers and honored by sbc-media's allocator.

[media]
default_mode = "Relay"
codecs = ["G711Ulaw", "G711Alaw", "G722"]
rtp_port_min = 16384
rtp_port_max = 16484

[media.srtp]
required = false

# ── Routing: send every call to the loopback trunk (the UAS) ──

[routing]
use_dial_plan = true
max_failover_attempts = 1
default_trunk_group = "loopback"

[[dial_plans]]
id = "catch-all"
name = "Route all calls to the loopback UAS"

  [[dial_plans.entries]]
  direction = "both"
  pattern_type = "any"
  pattern_value = ""
  trunk_group = "loopback"
  destination_type = "trunk_group"

# ── Rate Limiting ──

[rate_limit]
enabled = true
global_rps = 50000
per_ip_rps = 10000
per_user_rps = 5000
burst_multiplier = 5.0

[logging]
level = "info"
format = "text"
output = "stdout"

# ── Trunk Groups: loopback target = the SIPp UAS container ──

[[trunk_groups]]
id = "loopback"
name = "Loopback Test Target (SIPp UAS)"
zone = "signaling"
strategy = "round_robin"

  [[trunk_groups.trunks]]
  id = "loopback-1"
  host = "172.28.1.20"
  port = 5080
  protocol = "udp"
  max_calls = 5000
