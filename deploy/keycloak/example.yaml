# yaml-language-server: $schema=./voice-config.schema.json
#
# Example configuration for Configure-Voice.ps1:
#   ./Configure-Voice.ps1 -ConfigFile ./example.yaml
#
# Precedence: explicit CLI flag > this file > env var > built-in default.
#
# NO credentials belong in this file (the schema rejects them). Supply
# auth via flags or env: KC_ADMIN_TOKEN, KC_SA_CLIENT_ID/_SECRET, or
# KC_ADMIN_USER/_PASSWORD.

keycloak:
  url: https://icam.oopl.dev.mil
  realm: dcim
  # Where the admin credential lives; master for the global admin.
  authRealm: master

voice:
  sipDomain: uc.oopl.dev.mil
  softClientId: usg-uc-softclient
  provisioningClientId: usg-uc-provisioning
  redirectUris:
    # Desktop loopback (RFC 8252 §7.3 — any port)
    - http://127.0.0.1/*
    # Android claimed App Link (preferred per RFC 8252 §7.2)
    - https://app.uc.oopl.dev.mil/oauth2redirect
  # Device Authorization Grant for Get-TestToken.ps1 (CLI token minting
  # with browser/CAC auth). Disable once real clients are rolled out.
  enableDeviceFlow: true

# Optional — omit this whole section in production realms.
testUser:
  username: jwillman
  dn: "12092618716"
  # password: set via -TestUserPassword / $env:TEST_USER_PASSWORD instead
