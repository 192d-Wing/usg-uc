# USG Unified Communications SBC - Default Configuration
#
# This file provides sensible defaults for production deployment.
# Override values via environment variables or mounted ConfigMaps.
#
# ## NIST 800-53 Rev5 Controls
# - **CM-2**: Baseline Configuration
# - **CM-6**: Configuration Settings
# - **SC-13**: Cryptographic Protection (CNSA 2.0)

[general]
instance_name = "sbc-01"
# cluster_id = "cluster-01"
max_calls = 10000
max_registrations = 50000

[transport]
# Listen on all interfaces (IPv6 with IPv4 fallback)
udp_listen = ["[::]:5060"]
tcp_listen = ["[::]:5060"]
tls_listen = ["[::]:5061"]
# WebSocket disabled by default
ws_listen = []
wss_listen = []
tcp_timeout_secs = 30
tcp_idle_timeout_secs = 300

# Dual-interface deployment (optional):
# Bind SIP signaling and RTP media to separate interfaces
# signaling_ip = "10.0.1.10"    # SIP signaling interface
# media_ip = "10.0.2.10"        # RTP media interface

# External/public IP for NAT traversal (auto-detected if unset)
# external_ip = "203.0.113.10"

# REST API listen address (default: 0.0.0.0:8080)
# api_listen = "10.0.1.10:8080"

[media]
# Only "Relay" is accepted; per-realm overrides (realm_modes) are rejected
# by validation, and codecs must be the default set (any order).
default_mode = "Relay"
codecs = ["Opus", "G722", "G711Ulaw", "G711Alaw"]
rtp_port_min = 16384
rtp_port_max = 32768

[media.srtp]
# CNSA 2.0: SRTP required with AES-256-GCM
required = true
profile = "AeadAes256Gcm"

[media.t38]
# T.38 fax relay (RFC 3362 m=image udptl). Off by default: image offers get
# 488. UDPTL is cleartext, so with media.srtp.required = true, enabling it
# also needs allow_cleartext = true (NIST 800-53 SC-8, CM-6; POA&M-291).
enabled = false
allow_cleartext = false
max_bit_rate = 14400
max_datagram = 1400
max_buffer = 4096
allowed_ec = ["t38UDPRedundancy", "t38UDPFEC", "t38UDPNoEC"]

[media.dtls]
# DTLS certificate paths (mount via secrets)
# cert_path = "/etc/sbc/certs/dtls.crt"
# key_path = "/etc/sbc/certs/dtls.key"
fingerprint_hash = "Sha384"

[recording]
# SIPREC call recording (RFC 7866 session recording client). Off by default.
# Restart-required. Enabling it needs transport.tls_listen, security
# tls_cert_path / tls_key_path, an in-process media plane (no
# SBC_MEDIA_CONTROLLER_URL(S)) and a recorder that accepts TLS 1.3 and SDES
# AEAD_AES_256_GCM (NIST 800-53 AU-14, AU-5, CM-7, PT-5, SC-8;
# POA&M-300..309).
enabled = false
# Operator attests that call parties are told about recording (PT-5).
notice_acknowledged = false
# srs_uri = "sips:srs.example.net:5061"
# srs_tls_ca_file = "/etc/sbc/certs/srs-ca.pem"
# srs_tls_server_name = "srs.example.net"
# Trigger: every call, or calls with a leg on a listed trunk group / zone.
record_all = false
trunk_groups = []
zones = []
# A slot is held from the INVITE of a matched call (ringing calls count).
# With record_all, size this to general.max_calls. A recorded call uses four
# RTP port pairs instead of two.
max_sessions = 256
rs_invite_timeout_ms = 5000
# "reject" (default, fail closed): a matched call that cannot be recorded is
# refused (488 / 503) or ended. "continue": it stays up unrecorded (audited).
# Emergency calls always continue.
on_failure = "reject"
# "ignore" (default): record even if a party sends a=recordpref:off.
# "honour": any call party can opt its call out of recording.
recordpref_never = "ignore"
# Zone whose media address the recorder streams are sent from.
# srs_zone = "internal"

[security]
# TLS certificate paths (mount via secrets)
# tls_cert_path = "/etc/sbc/certs/tls.crt"
# tls_key_path = "/etc/sbc/certs/tls.key"
# CNSA 2.0: P-384 curve only
curve = "P384"
min_tls_version = "1.3"
require_mtls = false
# NIST 800-53 Rev5: SC-8 — every trunk group sends only on TLS trunks (no
# UDP/TCP fallback; 503 when none is usable). Per group: `require_tls = true`.
# require_tls_trunks = false

[stir_shaken]
# Verification is off until STI-CR trust anchors are configured (it was on by
# default before 0.10 but verified nothing). Enable per trunk with
# `stir_shaken = { verify = true }` / `{ sign = true }`.
signing_enabled = false
verification_enabled = false
# SHAKEN mandates ES256 (documented CNSA 2.0 exception).
algorithm = "ES256"

[stir_shaken.signing]
# certificate_url = "https://certs.example.com/sti.pem"
# private_key_path = "/etc/sbc/certs/sti.key"   # PKCS#8 P-256, mode 0600/0400
# certificate_path = "/etc/sbc/certs/sti.pem"

[stir_shaken.attestation]
default = "C"
# owned_numbers = ["1202555*"]

[stir_shaken.verification]
failure_policy = "mark"     # pass-through | mark | reject
max_passport_age_secs = 60
# trust_anchors_path = "/etc/sbc/certs/sti-cr"

[rate_limit]
enabled = true
global_rps = 10000
per_ip_rps = 100
per_user_rps = 50
burst_multiplier = 2.0

[logging]
level = "info"
format = "json"
output = "stdout"
audit_enabled = true
# audit_path = "/var/log/sbc/audit.log"

# Call Detail Records (schema v1). One record per INVITE that reaches
# admission. See docs/SBC-ADMIN-GUIDE.md "Call Detail Records".
[cdr]
enabled = true
format = "jsonl"                    # jsonl | csv
directory = "/var/lib/usg-sbc/cdr"  # absolute; created 0750, files 0640. Must be
                                    # writable by the daemon user or startup fails.
# node_id = "sbc-a"                 # default: general.instance_name, then $HOSTNAME
rotate_size_mb = 100                # 1..=4096
rotate_interval = "1h"              # "0" = size only; 5m..=24h
retention_files = 168               # 0 = unlimited
retention_days = 90                 # 0 = unlimited
fsync_interval_ms = 1000            # 0 = fsync every record
queue_capacity = 8192               # 64..=1000000
ring_capacity = 10000               # recent CDRs kept for the API, 0..=200000
hash_chain = true                   # SHA-384 chain + per-file .sha384 sidecar
record_unanswered = "all"           # all | routed | none
record_auth_challenges = false
pii = "full"                        # full | mask_caller | hash
# pii_hash_key_file = "/etc/usg-sbc/cdr-hmac.key"   # required for pii = "hash" (>= 48 bytes)
on_failure = "continue"             # continue | reject_new_calls (emergency calls always admitted)

[cdr.syslog]
enabled = false
target = "tls://collector.example.net:6514"   # RFC 5425; TLS only
# ca_path = "/etc/usg-sbc/syslog-ca.pem"
facility = 16                       # local0

# Clustering and shared storage (only with sbc-daemon built --features cluster;
# ignored otherwise). Startup fails closed:
#   - cluster.enabled = true requires [cluster.auth] (key_file >= 48 bytes,
#     mode 0600; group/other-readable files are refused).
#   - Non-TLS storage is refused unless allow_insecure_transport = true.
# [cluster]
# enabled = true
# cluster_id = "production"
# node_id = "sbc-01"
# [cluster.auth]
# key_file = "/etc/usg-sbc/cluster.key"
# key_id = 1
# [storage]
# backend = "postgres"              # memory | redis | postgres
# [storage.postgres]
# url = "postgres://sbc@db.example.net/sbc"
# ssl_mode = "verify_full"          # disable/prefer/require need allow_insecure_transport
# ssl_root_cert = "/etc/usg-sbc/pg-ca.pem"
# [storage.redis]
# url = "rediss://redis.example.net:6379"   # redis:// needs allow_insecure_transport
