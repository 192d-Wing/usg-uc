{{- if .Values.auth.create }}
{{- /*
Management-plane authentication Secret for sbc-api / sbc-provision.

- signing-key: HMAC key shared by every API replica so a token minted by
  one pod validates on any other (uc-auth is stateless). Generated once and
  PRESERVED across `helm upgrade` via lookup — regenerating it would
  invalidate every live session on each upgrade.
- admin-password-hash / admin-password: admin credential. Prefer
  auth.adminPasswordHash (argon2 PHC). If only a plaintext password is given
  it is hashed by the pod at startup. If neither is set a random password is
  generated and preserved; retrieve it from this Secret (see NOTES.txt).

Override with auth.existingSecret to manage these out-of-band (sealed-secrets
/ SOPS / Vault) instead.
*/ -}}
{{- $name := printf "%s-auth" (include "sbc.fullname" .) -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) -}}
{{- $signingKey := "" -}}
{{- $adminPassword := "" -}}
{{- if and $existing $existing.data -}}
{{-   if (index $existing.data "signing-key") -}}
{{-     $signingKey = (index $existing.data "signing-key" | b64dec) -}}
{{-   end -}}
{{-   if (index $existing.data "admin-password") -}}
{{-     $adminPassword = (index $existing.data "admin-password" | b64dec) -}}
{{-   end -}}
{{- end -}}
{{- if not $signingKey -}}
{{-   $signingKey = (randAlphaNum 64 | sha256sum) -}}
{{- end -}}
{{- if not $adminPassword -}}
{{-   $adminPassword = (.Values.auth.adminPassword | default (randAlphaNum 24)) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
type: Opaque
stringData:
  signing-key: {{ $signingKey | quote }}
  {{- if .Values.auth.adminPasswordHash }}
  admin-password-hash: {{ .Values.auth.adminPasswordHash | quote }}
  {{- else }}
  admin-password: {{ $adminPassword | quote }}
  {{- end }}
{{- end }}
