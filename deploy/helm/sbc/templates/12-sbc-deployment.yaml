# SBC daemon — single replica per site, single pod IP from Cilium's cluster
# pool. No Multus, no secondary CNIs. The pod's IP is BGP-advertised via the
# cluster PodCIDR advertisement. The daemon binds 0.0.0.0:5060 (single
# listener) and classifies zone post-receive by trunk-peer match / dial-plan
# routing rather than by which local IP a packet hit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sbc.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.sbcDaemon.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sbc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sbc.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include "sbc.config" . | sha256sum }}
    spec:
      serviceAccountName: {{ include "sbc.serviceAccountName" . }}
      # Pin to this site's node via the scheduler (not `nodeName`, which
      # bypasses scheduling entirely — that breaks WaitForFirstConsumer
      # PVC binding because the volume controller never sees the
      # scheduled-node signal).
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.site.node }}
      securityContext:
        {{- toYaml .Values.sbcDaemon.podSecurityContext | nindent 8 }}
      # initContainer renders config.toml with the pod's actual IP (downward
      # API). Without this we'd have to hard-code a placeholder; with it the
      # daemon binds to and advertises its real IP, so Via/Contact/SDP all
      # match the source IP that trunk peers see.
      initContainers:
        - name: render-config
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -e
              sed "s|__POD_IP__|${POD_IP}|g" /etc/sbc-template/config.toml > /etc/sbc-rendered/config.toml
              echo "Rendered config.toml with POD_IP=${POD_IP}"
          env:
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config-template, mountPath: /etc/sbc-template, readOnly: true }
            - { name: config-rendered, mountPath: /etc/sbc-rendered }
      containers:
        - name: sbc
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-c", "/etc/sbc/config.toml", "-f"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
            # File-backed SQLite path under the persistent volume mount.
            # Daemon falls back to :memory: if this var is unset.
            - name: SBC_SQLITE_PATH
              value: "/var/lib/sbc/sbc.db"
            # Postgres DSN. Sourced from either the chart-managed Secret
            # (sbcPostgres.enabled=true) or an operator-managed Secret
            # (sbcPostgres.existingSecret.name set). Daemon treats this as
            # optional: unset → legacy JSON-on-PVC path for config entities.
            {{- if .Values.sbcPostgres.enabled }}
            - name: SBC_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "sbc.fullname" . }}-postgres
                  key: dsn
            {{- else if .Values.sbcPostgres.existingSecret.name }}
            - name: SBC_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sbcPostgres.existingSecret.name }}
                  key: {{ .Values.sbcPostgres.existingSecret.key | default "dsn" }}
            {{- end }}
            {{- if .Values.sbcAnnouncement.enabled }}
            # Announcement pod is deployed — point the daemon at it so
            # "number not in service" / "all circuits busy" RTP flows
            # to the dedicated pod instead of running in-process.
            - name: SBC_ANNOUNCEMENT_URL
              value: "http://{{ include "sbc.fullname" . }}-announcement.{{ .Release.Namespace }}.svc.cluster.local:9095"
            {{- end }}
            {{- if .Values.sbcTrunkAgent.enabled }}
            # Trunk-agent pod is deployed — disable the daemon's own
            # registration + OPTIONS loops to avoid double-REGISTERing
            # to carriers. The agent pushes status snapshots back via
            # TrunkStatusPublishService.
            - name: SBC_TRUNK_SERVICES
              value: "external"
            {{- end }}
          ports:
            # SIP signaling — no hostPort; k3s ServiceLB DaemonSet already
            # binds hostPort 5060 on every node for the sip LoadBalancer
            # Service, so a second hostPort claim here would block scheduling.
            # Traffic reaches the daemon via kube-proxy DNAT on the LB IP.
            - { name: sip-udp,  containerPort: 5060, protocol: UDP }
            - { name: sip-tcp,  containerPort: 5060, protocol: TCP }
            - { name: sip-tls,  containerPort: 5061, protocol: TCP }
            - { name: api,      containerPort: 80,   protocol: TCP }
            - { name: metrics,  containerPort: 9090, protocol: TCP }
            # gRPC admin API; consumed by sbc-api-server (when enabled)
            # for TrunkSync / DialPlanSync / DidMappingSync RPCs.
            - { name: grpc,     containerPort: 9091, protocol: TCP }
          livenessProbe:
            httpGet: { path: /healthz, port: api }
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /readyz, port: api }
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet: { path: /healthz, port: api }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          resources:
            {{- toYaml .Values.sbcDaemon.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.sbcDaemon.securityContext | nindent 12 }}
          volumeMounts:
            - { name: config-rendered, mountPath: /etc/sbc/config.toml, subPath: config.toml, readOnly: true }
            - { name: data, mountPath: /var/lib/sbc }
            - { name: logs, mountPath: /var/log/sbc }
      volumes:
        - name: config-template
          configMap:
            name: {{ include "sbc.fullname" . }}-config
        - name: config-rendered
          emptyDir: {}
        - name: data
          {{- if .Values.sbcDaemon.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "sbc.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: logs
          emptyDir: {}
