{{- if .Values.sbcFrontend.enabled }}
# sbc-frontend — operator dashboard pod (nginx + React bundle).
#
# Why it's a separate Deployment: previously the React bundle was embedded
# into the sbc-daemon binary via include_dir!, which meant every UI release
# rebuilt and restarted the daemon — and the daemon's restart strategy
# (Recreate, single replica) drops every in-flight SIP call. With the
# bundle moved out, dashboard updates roll independently and never touch
# SIP/RTP.
#
# Topology:
#   browser/operator -> sbc-frontend LB (port 80) -> nginx
#     /            -> static SPA bundle
#     /api/*       -> ClusterIP svc {{ include "sbc.fullname" . }}-api -> daemon
#     /provision/* -> ClusterIP svc {{ include "sbc.fullname" . }}-api -> daemon
#
# The frontend Service shares the site's sbc_lb_ip with sbc-sip via
# Cilium's lbipam sharing-key annotation (sbc-sip claims 5060/5061,
# sbc-frontend claims 80 — no port collision).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sbc.fullname" . }}-frontend-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
data:
  default.conf.template: |-
{{ .Files.Get "files/nginx.conf.template" | default (include "sbc.frontendNginxConf" .) | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sbc.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.sbcFrontend.replicas }}
  strategy:
    # RollingUpdate (the default for Deployments) is what makes this whole
    # split worthwhile — operator dashboard releases roll one pod at a time
    # behind the Service while the daemon (and SIP) stays put.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "sbc.frontendSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sbc.frontendSelectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101        # nginxinc/nginx-unprivileged default uid
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: nginx
          image: "{{ .Values.sbcFrontend.image.repository }}:{{ .Values.sbcFrontend.image.tag }}"
          imagePullPolicy: {{ .Values.sbcFrontend.image.pullPolicy }}
          env:
            # Consumed by nginx-unprivileged's entrypoint, which runs
            # envsubst on /etc/nginx/templates/*.template -> /etc/nginx/conf.d/.
            # When sbcApi.enabled the API upstream is sbc-api-server
            # (which owns config-entity CRUD itself and proxies the
            # rest to the daemon). When disabled, point straight at
            # the daemon's API.
            - name: SBC_API_UPSTREAM
            {{- if .Values.sbcApi.enabled }}
              value: "{{ include "sbc.fullname" . }}-sbc-api.{{ .Release.Namespace }}.svc.cluster.local:80"
            {{- else }}
              value: "{{ include "sbc.fullname" . }}-api.{{ .Release.Namespace }}.svc.cluster.local:80"
            {{- end }}
            # Phone provisioning upstream. sbc-provision-server when
            # the dedicated pod is enabled; otherwise fall back to the
            # sbc-api upstream (which proxies /provision/* to the
            # daemon's legacy code path).
            - name: SBC_PROVISION_UPSTREAM
            {{- if .Values.sbcProvision.enabled }}
              value: "{{ include "sbc.fullname" . }}-provision.{{ .Release.Namespace }}.svc.cluster.local:80"
            {{- else if .Values.sbcApi.enabled }}
              value: "{{ include "sbc.fullname" . }}-sbc-api.{{ .Release.Namespace }}.svc.cluster.local:80"
            {{- else }}
              value: "{{ include "sbc.fullname" . }}-api.{{ .Release.Namespace }}.svc.cluster.local:80"
            {{- end }}
            # Restrict envsubst to ONLY this variable — without the filter,
            # envsubst eats nginx's own $1 capture groups, $host, $remote_addr,
            # and (importantly) the regex quantifier `{12,17}` which it
            # interprets as a malformed variable reference. The visible
            # symptom was nginx refusing to start with
            # `pcre2_compile() failed: missing closing parenthesis`.
            - name: NGINX_ENVSUBST_FILTER
              value: "^SBC_"
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          livenessProbe:
            httpGet: { path: /nginx-health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /nginx-health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.sbcFrontend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: nginx-config, mountPath: /etc/nginx/templates }
            # nginx-unprivileged writes its rendered conf, pid, and temp
            # bodies under these paths; mount tmpfs since the rootfs is RO.
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run,   mountPath: /var/run }
            - { name: nginx-confd, mountPath: /etc/nginx/conf.d }
            # nginx proxy buffering uses /tmp/proxy_temp, /tmp/client_body_temp,
            # /tmp/fastcgi_temp, /tmp/uwsgi_temp, /tmp/scgi_temp. The
            # nginx-unprivileged image defaults these to /tmp/* which is on
            # the read-only rootfs unless we mount a writable emptyDir.
            - { name: nginx-tmp,   mountPath: /tmp }
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "sbc.fullname" . }}-frontend-nginx
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-confd
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sbc.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  annotations:
    {{- if and .Values.externalDns.enabled (not .Values.gateway.enabled) }}
    external-dns.alpha.kubernetes.io/hostname: "sbc.{{ .Values.site.fqdn_base }}"
    external-dns.alpha.kubernetes.io/ttl: "60"
    coredns.io/hostname: "sbc.{{ .Values.site.fqdn_base }}"
    {{- end }}
    {{- if not .Values.gateway.enabled }}
    lbipam.cilium.io/ips: "{{ .Values.site.sbc_lb_ip }}"
    lbipam.cilium.io/sharing-key: "{{ .Values.site.name }}-sbc"
    {{- end }}
spec:
  # When the Gateway is enabled it owns the LB IP and terminates TLS; the
  # frontend then sits behind it as a ClusterIP backend (the :80 port would
  # otherwise collide with the Gateway's HTTP-redirect listener on the
  # shared IP).
  type: {{ if .Values.gateway.enabled }}ClusterIP{{ else }}LoadBalancer{{ end }}
  # Cluster (not Local) policy: the dashboard tolerates SNAT'd client IPs
  # (it doesn't peer-auth on source IP like SIP does), and Cluster policy
  # lets the LB target frontend pods on any node — important because the
  # daemon is node-pinned but the frontend is not.
  externalTrafficPolicy: Cluster
  selector:
    {{- include "sbc.frontendSelectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
{{- end }}

{{/* Fallback inline nginx config — used when files/nginx.conf.template
     is not packaged with the chart. Kept in sync by hand with the
     standalone crates/sbc/sbc-dashboard/nginx.conf.template. */}}
{{- define "sbc.frontendNginxConf" -}}
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass         http://${SBC_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /provision/ {
        proxy_pass         http://${SBC_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Phones (TEO especially) hit the root path on first-boot — DHCP option
    # 66 only carries a hostname, so firmware fetches /<MAC>.xml or
    # /<MAC>.cfg from the root. Match a hex MAC (12 chars, any case, with or
    # without colon/dash separators) followed by .xml or .cfg and rewrite
    # to the daemon's canonical /provision/ path. Subsequent refreshes use
    # the update_server URL embedded in the returned XML and hit
    # /provision/ directly.
    location ~ ^/([0-9A-Fa-f:_-]{12,17}\.(?:xml|cfg))$ {
        proxy_pass         http://${SBC_API_UPSTREAM}/provision/$1;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # TEO global config file (TEO spec p.19) — phones fetch this in some
    # firmwares before the per-MAC file. Daemon currently returns 404 for it
    # with a clear body, but we still need to proxy so the 404 is the
    # daemon's 404 (with the right Content-Type and body) and not nginx's
    # SPA fallback returning index.html.
    location = /TCS7000A.xml {
        proxy_pass         http://${SBC_API_UPSTREAM}/provision/TCS7000A.xml;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
{{- end }}
