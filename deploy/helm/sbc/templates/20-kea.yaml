{{- if .Values.kea.enabled }}
# Kea DHCPv4 in relay mode. Exposed via a LoadBalancer Service with a fixed
# loadBalancerIP from the site's CiliumLoadBalancerIPPool — this is THE one
# spot a stable IP is required, because each phone VLAN's
# `ip helper-address` upstream config is L3-only and can't be an FQDN.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sbc.fullname" . }}-kea-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
data:
  kea-dhcp4.conf: |-
    {{- include "kea.config" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sbc.fullname" . }}-kea
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "sbc.keaSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sbc.keaSelectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include "kea.config" . | sha256sum }}
    spec:
      nodeName: {{ .Values.site.node }}
      containers:
        - name: kea-dhcp4
          image: "{{ .Values.kea.image.repository }}:{{ .Values.kea.image.tag }}"
          args: ["-c", "/etc/kea/kea-dhcp4.conf"]
          ports:
            - { name: dhcp, containerPort: 67, protocol: UDP }
          resources:
            {{- toYaml .Values.kea.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/kea/kea-dhcp4.conf, subPath: kea-dhcp4.conf, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: {{ include "sbc.fullname" . }}-kea-config
---
# Stable LB IP for the DHCP relay target. The site label triggers
# Cilium's LB pool allocation; the loadBalancerIP request pins to the
# value in values.yaml.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sbc.fullname" . }}-kea
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
spec:
  type: LoadBalancer
  loadBalancerIP: {{ .Values.site.kea_lb_ip }}
  externalTrafficPolicy: Local        # preserve DHCP relay source IP so giaddr stays intact
  selector:
    {{- include "sbc.keaSelectorLabels" . | nindent 4 }}
  ports:
    - { name: dhcp, port: 67, targetPort: 67, protocol: UDP }
{{- end }}
