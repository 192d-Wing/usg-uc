{{- if .Values.sbcDaemon.persistence.enabled }}
# PersistentVolumeClaim for /var/lib/sbc. Backs the SQLite user store and
# the JSON-persisted entity files (phones, directory_numbers, trunk_groups).
# Survives pod restarts, helm upgrades, and (for non-emptyDir storage
# classes) node reboots.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sbc.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.sbcDaemon.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.sbcDaemon.persistence.size }}
  {{- with .Values.sbcDaemon.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.sbcDaemon.cdr.enabled .Values.sbcDaemon.cdr.persistence.enabled }}
---
# Dedicated CDR volume (mounted at sbcDaemon.cdr.directory). Kept apart
# from the data volume so CDR growth, including a burst of rejected calls,
# cannot fill the user/config store (NIST 800-53 Rev5: AU-4, SC-5).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sbc.fullname" . }}-cdr
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.sbcDaemon.cdr.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.sbcDaemon.cdr.persistence.size }}
  {{- with .Values.sbcDaemon.cdr.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
