{{- if .Values.sbcApi.enabled }}
# sbc-api-server — stand-alone REST API pod.
#
# Owns config-entity CRUD (phones, DIDs, trunk groups, dial plans)
# directly out of Postgres and proxies everything else to the daemon's
# REST endpoint. After a write that needs SIP-router invalidation it
# calls the daemon's TrunkSync / DialPlanSync / DidMappingSync gRPC
# services. Lets the dashboard and operator tooling come and go
# without touching the SIP-serving process.
#
# The nginx frontend (16-sbc-frontend.yaml) routes /api/* here when
# sbcApi.enabled is true; otherwise it falls back to the daemon's API
# Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sbc.fullname" . }}-sbc-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.sbcApi.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "sbc.apiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sbc.apiSelectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      {{- $ha1Secret := .Values.sbcApi.ha1Key.existingSecret | default (printf "%s-ha1-key" (include "sbc.fullname" .)) }}
      initContainers:
        # HA1 key: sbc-api refuses a key file not owned by its own uid with
        # owner-only mode. Secret volumes are root-owned and fsGroup-readable,
        # so copy into a memory-backed emptyDir as this (same-uid) container
        # and chmod 0400. NIST 800-53 Rev5: SC-12, SC-28(1)
        - name: ha1-key
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -e
              cp /etc/sbc/ha1-key-src/{{ .Values.sbcApi.ha1Key.key | quote }} /run/secrets/sbc-ha1/ha1-key
              chmod 0400 /run/secrets/sbc-ha1/ha1-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: ha1-key-src, mountPath: /etc/sbc/ha1-key-src, readOnly: true }
            - { name: ha1-key, mountPath: /run/secrets/sbc-ha1 }
      containers:
        - name: sbc-api
          image: "{{ .Values.sbcApi.image.repository }}:{{ .Values.sbcApi.image.tag }}"
          imagePullPolicy: {{ .Values.sbcApi.image.pullPolicy }}
          env:
            - name: SBC_API_LISTEN_ADDR
              value: "0.0.0.0:80"
            # Daemon endpoints — both ClusterIPs created by
            # 13-sbc-services.yaml. The daemon's REST stays running
            # post-cutover so the proxy fallback still has somewhere
            # to land non-config requests (calls, registrations, etc.).
            - name: SBC_DAEMON_HTTP_URL
              value: "http://{{ include "sbc.fullname" . }}-api.{{ .Release.Namespace }}.svc.cluster.local:80"
            - name: SBC_DAEMON_GRPC_URL
              value: {{ include "sbc.daemonGrpcUrl" . | quote }}
            {{- if .Values.sbcDaemon.grpcMtls.enabled }}
            # mTLS client identity for the daemon gRPC listener; needed for
            # the CDR API (CdrService is mTLS/loopback only). NIST: IA-3, SC-8
            - name: SBC_DAEMON_GRPC_TLS_CA_FILE
              value: /etc/sbc/grpc-tls/ca.crt
            - name: SBC_DAEMON_GRPC_TLS_CERT_FILE
              value: /etc/sbc/grpc-tls/tls.crt
            - name: SBC_DAEMON_GRPC_TLS_KEY_FILE
              value: /etc/sbc/grpc-tls/tls.key
            {{- end }}
            # Postgres DSN — same Secret the daemon reads. sbc-api owns
            # the write side of the four config-entity tables; the
            # daemon still reads the same tables for SIP-router replay.
            {{- if .Values.sbcPostgres.enabled }}
            - name: SBC_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "sbc.fullname" . }}-postgres
                  key: dsn
            {{- else if .Values.sbcPostgres.existingSecret.name }}
            - name: SBC_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sbcPostgres.existingSecret.name }}
                  key: {{ .Values.sbcPostgres.existingSecret.key | default "dsn" }}
            {{- end }}
            {{- if .Values.sbcApi.oidc.issuer }}
            # Operator OIDC: accept the same config-admin bearer tokens the
            # central config API takes, so the dashboard signs in once. The
            # legacy admin login keeps working alongside this.
            - name: SBC_OIDC_ISSUER
              value: {{ .Values.sbcApi.oidc.issuer | quote }}
            - name: SBC_OIDC_AUDIENCE
              value: {{ .Values.sbcApi.oidc.audience | quote }}
            {{- if .Values.sbcClientConfig.extraCaCert }}
            # Trust the internal CA for the JWKS fetch (same cert the daemon
            # uses); without it the OIDC issuer behind the internal-CA edge
            # can't be verified and every bearer 401s.
            - name: SBC_OIDC_EXTRA_CA_CERT_FILE
              value: "/etc/ssl/extra-ca/oopl-ca.pem"
            {{- end }}
            {{- end }}
            {{- with .Values.sbcApi.auditPath }}
            # Optional hash-chained audit file (fail-closed when set: the pod
            # exits if it cannot be opened). Must be on a writable volume
            # mounted via extraVolumes. NIST: AU-9
            - name: SBC_API_AUDIT_PATH
              value: {{ . | quote }}
            {{- end }}
            # HA1-at-rest key (required, fail-closed). NIST: SC-28(1)
            - name: SBC_USER_HA1_KEY_FILE
              value: /run/secrets/sbc-ha1/ha1-key
            # Management-plane auth (fail-closed: the pod won't start
            # without these). Shared signing key so any replica validates
            # any replica's tokens.
            {{- $authSecret := .Values.auth.existingSecret.name | default (printf "%s-auth" (include "sbc.fullname" .)) }}
            - name: SBC_AUTH_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecret }}
                  key: signing-key
            {{- if .Values.auth.adminPasswordHash }}
            - name: SBC_ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecret }}
                  key: admin-password-hash
            {{- else }}
            - name: SBC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecret }}
                  key: admin-password
            {{- end }}
          ports:
            - { name: http, containerPort: 80, protocol: TCP }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.sbcApi.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          {{- $extraCa := and .Values.sbcApi.oidc.issuer .Values.sbcClientConfig.extraCaCert }}
          volumeMounts:
            - { name: ha1-key, mountPath: /run/secrets/sbc-ha1, readOnly: true }
            {{- if $extraCa }}
            - { name: extra-ca, mountPath: /etc/ssl/extra-ca, readOnly: true }
            {{- end }}
            {{- if .Values.sbcDaemon.grpcMtls.enabled }}
            - { name: grpc-tls, mountPath: /etc/sbc/grpc-tls, readOnly: true }
            {{- end }}
      volumes:
        - name: ha1-key-src
          secret:
            secretName: {{ $ha1Secret }}
            defaultMode: 0440
        - name: ha1-key
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
        {{- if $extraCa }}
        - name: extra-ca
          configMap:
            name: {{ include "sbc.fullname" . }}-client-config-ca
        {{- end }}
        {{- if .Values.sbcDaemon.grpcMtls.enabled }}
        - name: grpc-tls
          secret:
            secretName: {{ include "sbc.grpcClientTlsSecret" . }}
            defaultMode: 0440
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sbc.fullname" . }}-sbc-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "sbc.apiSelectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
{{- end }}
