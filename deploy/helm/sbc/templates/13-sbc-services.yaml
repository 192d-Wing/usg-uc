# Headless Services for SBC. clusterIP: None makes DNS for the Service name
# return the pod IPs directly (no DNAT). ExternalDNS picks up the hostname
# annotation and creates an A record in the configured DNS provider that
# also points at the pod IPs — so any client resolving the FQDN hits the
# SBC at its current Cilium-assigned IP.
{{- if .Values.services.sip.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sbc.fullname" . }}-sip
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
  {{- if .Values.externalDns.enabled }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "sbc.{{ .Values.site.fqdn_base }}"
    external-dns.alpha.kubernetes.io/ttl: "60"
  {{- end }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "sbc.selectorLabels" . | nindent 4 }}
  ports:
    - { name: sip-udp, port: 5060, targetPort: 5060, protocol: UDP }
    - { name: sip-tcp, port: 5060, targetPort: 5060, protocol: TCP }
    - { name: sip-tls, port: 5061, targetPort: 5061, protocol: TCP }
{{- end }}
{{- if .Values.services.api.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sbc.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
  {{- if .Values.externalDns.enabled }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "sbc.{{ .Values.site.fqdn_base }}"
    external-dns.alpha.kubernetes.io/ttl: "60"
  {{- end }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "sbc.selectorLabels" . | nindent 4 }}
  ports:
    - { name: api, port: 80, targetPort: 80, protocol: TCP }
{{- end }}
{{- if .Values.services.metrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sbc.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "sbc.selectorLabels" . | nindent 4 }}
  ports:
    - { name: metrics, port: 9090, targetPort: 9090, protocol: TCP }
{{- end }}
