# LoadBalancer Services for SIP signaling + REST API. Use a single fixed
# loadBalancerIP from the site's CiliumLoadBalancerIPPool so the SBC's
# ingress is reachable at one stable address (FQDN resolves here via the
# sibling coredns-site chart's k8s_gateway plugin).
#
# externalTrafficPolicy: Local keeps the client's source IP intact through
# kube-proxy's DNAT — important for SIP peer authentication and access
# logging.
{{- if .Values.services.sip.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sbc.fullname" . }}-sip
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
  annotations:
    # Cilium LBIPAM — always set so the SIP service can share its LB IP
    # with the frontend Service (same IP, non-overlapping ports). These are
    # Cilium-level annotations and must be present regardless of ExternalDNS.
    lbipam.cilium.io/ips: "{{ .Values.site.sbc_lb_ip }}"
    lbipam.cilium.io/sharing-key: "{{ .Values.site.name }}-sbc"
    lbipam.cilium.io/sharing-cross-namespace: "*"
    {{- if .Values.externalDns.enabled }}
    external-dns.alpha.kubernetes.io/hostname: "sbc.{{ .Values.site.fqdn_base }}"
    external-dns.alpha.kubernetes.io/ttl: "60"
    coredns.io/hostname: "sbc.{{ .Values.site.fqdn_base }}"
    {{- end }}
spec:
  type: LoadBalancer
  loadBalancerIP: {{ .Values.site.sbc_lb_ip }}
  # Cluster (not Local) — must match the frontend Service's policy for
  # Cilium's lbipam sharing-key to permit IP sharing. The cost is that
  # the SBC sees kube-proxy's SNAT'd IP (not the original client) for
  # ingress traffic — SIP peer authentication via `received=` header
  # still works, but IP-based ACLs would need rework. If you want strict
  # source-IP preservation, switch back to Local AND give sbc-sip its
  # own LB IP separate from sbc-frontend.
  externalTrafficPolicy: Cluster
  selector:
    {{- include "sbc.selectorLabels" . | nindent 4 }}
  ports:
    - { name: sip-udp, port: 5060, targetPort: 5060, protocol: UDP }
    - { name: sip-tcp, port: 5060, targetPort: 5060, protocol: TCP }
    - { name: sip-tls, port: 5061, targetPort: 5061, protocol: TCP }
{{- end }}
{{- if .Values.services.api.enabled }}
---
# Internal-only API surface. The sbc-frontend nginx pod reverse-proxies
# /api/* and /provision/* requests here. Operators reach the API through
# the frontend Service's LB IP (port 80), not directly — which means rolling
# the dashboard never touches the daemon, and the daemon's API can be
# restarted without exposing operators to half-rendered pages.
#
# ClusterIP (not LoadBalancer) on purpose: external port 80 is owned by
# sbc-frontend now.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sbc.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "sbc.selectorLabels" . | nindent 4 }}
  ports:
    - { name: api, port: 80, targetPort: 80, protocol: TCP }
{{- end }}
---
# Daemon gRPC admin endpoint. ClusterIP only — never externally exposed.
# sbc-api-server reaches the daemon's TrunkSync / DialPlanSync /
# DidMappingSync services here. Always created (no feature gate) since
# the gRPC server is enabled in the daemon image.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sbc.fullname" . }}-grpc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "sbc.selectorLabels" . | nindent 4 }}
  ports:
    - { name: grpc, port: 9091, targetPort: 9091, protocol: TCP }
{{- if .Values.services.metrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sbc.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "sbc.selectorLabels" . | nindent 4 }}
  ports:
    - { name: metrics, port: 9090, targetPort: 9090, protocol: TCP }
{{- end }}
