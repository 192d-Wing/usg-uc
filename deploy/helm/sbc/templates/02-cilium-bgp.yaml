{{- if .Values.bgp.install_cluster_config }}
# Cluster-wide BGP cluster config. Install once on the first site; subsequent
# sites in the same cluster set bgp.install_cluster_config: false.
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: bgp-cluster-config
spec:
  nodeSelector:
    matchExpressions:
      - { key: kubernetes.io/os, operator: In, values: [linux] }
  bgpInstances:
    - name: instance-{{ .Values.bgp.cluster_asn }}
      localASN: {{ .Values.bgp.cluster_asn }}
      peers:
        - name: upstream
          peerASN: {{ .Values.bgp.upstream.asn }}
          peerAddress: {{ .Values.bgp.upstream.ip }}
          peerConfigRef:
            name: upstream-peer-config
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: upstream-peer-config
spec:
  timers:
    holdTimeSeconds: 90
    keepAliveTimeSeconds: 30
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
---
# Cluster-wide: advertise the cluster pod CIDR so pods are directly
# reachable upstream by their IPs (FQDN A records point here).
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: pod-cidr-advertisement
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: PodCIDR
{{- end }}
---
# Per-site: advertise this site's LoadBalancer IPs (the SBC SIP/API VIP).
# The /32 is advertised only while the Service is allocated an IP from the
# pool, so removing the chart removes the advertisement.
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: {{ include "sbc.fullname" . }}-lb-advertisement
  labels:
    # Must match the matchLabels of the ACTIVE CiliumBGPPeerConfig. When
    # joining a cluster whose BGP config was installed by another chart
    # (install_cluster_config: false), set bgp.advertise_label to that
    # config's selector value or the LB IPs are never advertised upstream.
    advertise: {{ .Values.bgp.advertise_label | default "bgp" }}
    {{- include "sbc.labels" . | nindent 4 }}
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchLabels:
          sbc.usg/site: {{ .Values.site.name }}
