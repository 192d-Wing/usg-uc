{{- include "sbc.grpcMtlsPreflight" . }}
{{- if .Values.sbcDaemon.grpcMtls.enabled }}
{{- /*
mTLS for the daemon gRPC listener (sbcDaemon.grpcMtls, on by default). A
gRPC listener off loopback always requires an allow-listed client
certificate, on every service. With clusterIssuer set, cert-manager issues
ECDSA P-384 (CNSA 2.0) certificates: a server certificate for the -grpc
Service, a client certificate for sbc-api and, when sbcTrunkAgent is
enabled, one for the trunk agent. Otherwise the Secrets must already exist
(tls.crt, tls.key, ca.crt).

NIST 800-53 Rev5: IA-3, SC-8, SC-13, AC-3
*/ -}}
{{- if .Values.sbcDaemon.grpcMtls.clusterIssuer }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "sbc.fullname" . }}-grpc-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
spec:
  secretName: {{ include "sbc.grpcServerTlsSecret" . }}
  dnsNames:
    - {{ printf "%s-grpc" (include "sbc.fullname" .) }}
    - {{ printf "%s-grpc.%s.svc" (include "sbc.fullname" .) .Release.Namespace }}
    - {{ printf "%s-grpc.%s.svc.cluster.local" (include "sbc.fullname" .) .Release.Namespace }}
  usages: [server auth]
  privateKey:
    algorithm: ECDSA
    size: 384
    rotationPolicy: Always
  issuerRef:
    name: {{ .Values.sbcDaemon.grpcMtls.clusterIssuer | quote }}
    kind: {{ .Values.sbcDaemon.grpcMtls.issuerKind | default "ClusterIssuer" }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "sbc.fullname" . }}-grpc-client
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
spec:
  secretName: {{ include "sbc.grpcClientTlsSecret" . }}
  commonName: {{ printf "%s-sbc-api" (include "sbc.fullname" .) }}
  usages: [client auth]
  privateKey:
    algorithm: ECDSA
    size: 384
    rotationPolicy: Always
  issuerRef:
    name: {{ .Values.sbcDaemon.grpcMtls.clusterIssuer | quote }}
    kind: {{ .Values.sbcDaemon.grpcMtls.issuerKind | default "ClusterIssuer" }}
{{- if .Values.sbcTrunkAgent.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "sbc.fullname" . }}-grpc-trunk-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
spec:
  secretName: {{ include "sbc.grpcTrunkAgentClientTlsSecret" . }}
  commonName: {{ printf "%s-sbc-trunk-agent" (include "sbc.fullname" .) }}
  usages: [client auth]
  privateKey:
    algorithm: ECDSA
    size: 384
    rotationPolicy: Always
  issuerRef:
    name: {{ .Values.sbcDaemon.grpcMtls.clusterIssuer | quote }}
    kind: {{ .Values.sbcDaemon.grpcMtls.issuerKind | default "ClusterIssuer" }}
{{- end }}
{{- end }}
{{- end }}
