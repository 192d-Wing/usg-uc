{{- if and .Values.sbcApi.enabled (not .Values.sbcApi.ha1Key.existingSecret) }}
{{- /*
AES-256-GCM key sealing SIP digest HA1 values at rest in the `users` table
(sbc-api SBC_USER_HA1_KEY_FILE). 64 hex chars = 32 bytes.

Production: set sbcApi.ha1Key.existingSecret (managed out-of-band:
sealed-secrets / SOPS / Vault). Rendering fails without it.

LAB ONLY: sbcApi.ha1Key.generate=true lets the chart generate the key once
and preserve it via `lookup`. `lookup` is empty under `helm template`,
`--dry-run`, Argo CD and Flux, so a GitOps render would emit a NEW key and
make every stored HA1 undecryptable. The key also lands in Helm release
records. On upgrade with an empty lookup we `fail` instead of regenerating.

NIST 800-53 Rev5: SC-12, SC-28(1), CP-9. POA&M-111: no rotation tooling / HSM.
*/ -}}
{{- if not .Values.sbcApi.ha1Key.generate -}}
{{-   fail "sbcApi.ha1Key.existingSecret is required (Secret with key `ha1-key`, 64 hex chars: `openssl rand -hex 32`). Set sbcApi.ha1Key.generate=true only for disposable labs; see DEPLOYING.md." -}}
{{- end -}}
{{- $name := printf "%s-ha1-key" (include "sbc.fullname" .) -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) -}}
{{- $key := "" -}}
{{- if and $existing $existing.data (index $existing.data "ha1-key") -}}
{{-   $key = (index $existing.data "ha1-key" | b64dec) -}}
{{- end -}}
{{- if and (not $key) .Release.IsUpgrade -}}
{{-   fail (printf "sbcApi.ha1Key.generate: Secret %s not readable during upgrade (helm template/--dry-run/GitOps or missing Secret); refusing to generate a new key that would orphan every stored HA1. Use sbcApi.ha1Key.existingSecret." $name) -}}
{{- end -}}
{{- if not $key -}}
{{-   $key = (randAlphaNum 64 | sha256sum) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    # Never delete on uninstall: losing the key loses every stored HA1.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ha1-key: {{ $key | quote }}
{{- end }}
