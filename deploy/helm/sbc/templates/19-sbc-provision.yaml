{{- if .Values.sbcProvision.enabled }}
# sbc-provision-server — phone provisioning HTTP pod.
#
# Owns `/provision/<MAC>.{cfg,xml}`. Reads the phone record from
# Postgres (sbc-config-store::PostgresPhoneStore.get_by_mac) and
# renders the vendor config through uc_phone_mgmt::ProvisioningServer.
#
# Rolls independently of the daemon and sbc-api. Phones re-fetch on
# their own boot cycle, so a brief unavailability during a rolling
# update doesn't disrupt active calls. The daemon's old serve_phone_
# config code path is still present but no longer on the request path
# once nginx routes /provision/* here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sbc.fullname" . }}-provision
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
    app.kubernetes.io/component: provision
spec:
  replicas: {{ .Values.sbcProvision.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "sbc.provisionSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sbc.provisionSelectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: sbc-provision
          image: "{{ .Values.sbcProvision.image.repository }}:{{ .Values.sbcProvision.image.tag }}"
          imagePullPolicy: {{ .Values.sbcProvision.image.pullPolicy }}
          env:
            - name: SBC_PROVISION_LISTEN_ADDR
              value: "0.0.0.0:80"
            # FQDN + port baked into rendered phone configs as the
            # next-fetch URL (`update_server` field). Phones come back
            # here after first boot. Matches the daemon's old
            # [provisioning] section.
            - name: SBC_PROVISION_HOST
              value: "sbc.{{ .Values.site.fqdn_base }}"
            - name: SBC_PROVISION_PORT
              value: "80"
            # Same Postgres DSN the daemon + sbc-api read.
            {{- if .Values.sbcPostgres.enabled }}
            - name: SBC_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "sbc.fullname" . }}-postgres
                  key: dsn
            {{- else if .Values.sbcPostgres.existingSecret.name }}
            - name: SBC_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sbcPostgres.existingSecret.name }}
                  key: {{ .Values.sbcPostgres.existingSecret.key | default "dsn" }}
            {{- end }}
          ports:
            - { name: http, containerPort: 80, protocol: TCP }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.sbcProvision.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sbc.fullname" . }}-provision
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sbc.labels" . | nindent 4 }}
    app.kubernetes.io/component: provision
spec:
  type: ClusterIP
  selector:
    {{- include "sbc.provisionSelectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
{{- end }}
