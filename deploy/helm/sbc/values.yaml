# USG SBC — per-site L3 deployment (Cilium native, single-IP-per-pod).
#
# Architecture:
#   - One SBC pod per site, single IP from the site's CiliumPodIPPool (/28)
#   - Cilium BGP advertises the /28 to the site's upstream router
#   - Phones / trunks / operators all reach the SBC at one stable site IP
#   - Zone identity is a logical SIP-classification concept (by remote peer
#     IP, dial pattern, trunk peer match), not a wire-level binding
#   - No Multus, no Whereabouts, no secondary CNIs
#
# NIST 800-53 Rev5: CM-2 (baseline), CM-6 (settings), SC-7 (boundary).

site:
  name: kfk-001
  node: k8-01
  # /28 reserved for this site's SBC pods. Advertised via Cilium BGP.
  pod_cidr: "10.50.1.0/28"
  # Stable IP the SBC pod binds to. Pinned via ipam.cilium.io/ipv4-address
  # so trunk peers and DHCP clients see the same address across pod restarts.
  sbc_ip: "10.50.1.10"
  # Stable IP for Kea (DHCP relay target on each phone VLAN).
  kea_ip: "10.50.1.13"

bgp:
  # Per-site BGPClusterConfig + Advertisement. Set to false on subsequent
  # site charts deployed to the same cluster (the cluster-wide BGP cluster
  # config is shared and only needs one install).
  install_cluster_config: false
  # Cluster's BGP ASN.
  cluster_asn: 65001
  upstream:
    ip: "10.0.100.1"
    asn: 65000

image:
  repository: sbc-daemon
  tag: local
  pullPolicy: Never

# SBC daemon
sbcDaemon:
  replicas: 1
  resources:
    requests: { cpu: "500m", memory: "512Mi" }
    limits:   { cpu: "2",    memory: "2Gi"   }
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
      add: [NET_BIND_SERVICE]
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  config:
    max_calls: 5000
    max_registrations: 10000
    media_mode: Relay
    srtp_required: true
    api_listen: "0.0.0.0:80"
    metrics_listen: "0.0.0.0:9090"

# Kea DHCPv4 (relay mode)
kea:
  enabled: true
  image:
    repository: docker.io/jonasal/kea-dhcp4
    tag: "2.6.1"
  resources:
    requests: { cpu: "50m",  memory: "64Mi"  }
    limits:   { cpu: "200m", memory: "256Mi" }
  phone_subnets:
    - subnet:      "10.50.10.0/24"
      pool:        ["10.50.10.50", "10.50.10.250"]
      gateway:     "10.50.10.1"
      tftp_server: "10.50.1.10"        # = site.sbc_ip

# Services for in-cluster DNS access (zone IPs are reached directly via BGP
# from outside the cluster, so external Services aren't needed)
services:
  sip:     { enabled: true }
  api:     { enabled: true }
  metrics: { enabled: true }
