# sbc-announcement-server — announcement playback pod (optional).
# Hosts the gRPC AnnouncementService: the daemon delegates announcement
# media here via SBC_ANNOUNCEMENT_URL; the pod binds the RTP socket,
# streams the PCMU announcement to the caller, and reports completion.
# Stateless — the daemon falls back to in-process playback when this pod
# is absent or unreachable. Docs: docs/architecture.md.
sbcAnnouncement:
  enabled: false
  replicas: 2
  image:
    repository: localhost/usg-sbc-announcement-server
    tag: local
    pullPolicy: Never
  resources:
    requests: { cpu: "20m",  memory: "32Mi"  }
    limits:   { cpu: "200m", memory: "128Mi" }
  # IP advertised in SDP (and returned in the gRPC Bound event). Must be
  # reachable by calling phones/carriers. Required when enabled.
  advertisedIp: ""
  # Bind RTP on a specific IP (defaults to 0.0.0.0).
  bindIp: ""
  # RTP port range. If unset the pod uses ephemeral ports — expose the
  # node's ephemeral range, or set a pinned range and expose it.
  rtpPortMin: ""
  rtpPortMax: ""
  # Initial silence before the first media frame (milliseconds).
  defaultDelayMs: 200

# sbc-trunk-agent — trunk health + carrier registration pod (optional).
# Runs the SIP OPTIONS health monitor and outbound carrier REGISTER loops
# outside the daemon. The daemon must run with SBC_TRUNK_SERVICES=external
# when this pod is enabled. Deploy exactly ONE replica — a second agent
# would double-REGISTER to carriers.
sbcTrunkAgent:
  enabled: false
  image:
    repository: localhost/usg-sbc-trunk-agent
    tag: local
    pullPolicy: Never
  resources:
    requests: { cpu: "20m",  memory: "64Mi"  }
    limits:   { cpu: "200m", memory: "256Mi" }
  # SIP Contact IP embedded in REGISTER/OPTIONS — must be the pod's
  # public IP (or a NAT'd public IP visible to carriers). Warning: if
  # unset, carriers may route inbound calls here instead of the daemon.
  sipContactIp: ""
  # Bind local UDP :5060 on this IP so the SIP source port matches what
  # carriers expect for NAT keepalive. Requires CAP_NET_BIND_SERVICE
  # (set in the Dockerfile via setcap).
  trunkBindIp: ""
  # How often to poll Postgres for trunk config changes (seconds).
  trunkPollSecs: 30
  # How often to push status snapshots to the daemon (seconds).
  publishIntervalSecs: 10

# sbc-config-sync — per-site config sync agent. Pulls this site's shard
# from the central config API into the local Postgres. Off by default;
# enable once the site is registered centrally and onboarded (imported).
sbcConfigSync:
  enabled: false
  image:
    repository: localhost/usg-sbc-config-sync
    tag: local
    pullPolicy: Never
  resources:
    requests: { cpu: "10m",  memory: "32Mi"  }
    limits:   { cpu: "100m", memory: "128Mi" }
  # Canonical (uppercase) site code = this site's central shard. Defaults
  # to the upper-cased helm site.name (oopl-001 → OOPL-001) if unset.
  siteCode: ""
  # Central config API base URL, no trailing slash, e.g.
  # https://config.uc.example.mil
  centralUrl: ""
  # How often to poll the central /epoch probe (seconds). A per-site
  # jitter is added in-agent so 184 agents don't poll in lockstep.
  intervalSecs: 60
  # Secret holding the OIDC service-account bearer token (config-sync
  # scope, this site's site_code claim). Defaults to a Secret named
  # <release>-config-sync with key "token".
  tokenSecret:
    name: ""
    key: token

sbcDaemon:
  replicas: 1
  # PVC for /var/lib/sbc — holds the file-backed SQLite (users / HA1s) and
  # JSON-persisted phones, directory_numbers, trunk_groups. Survives pod
  # restarts, helm upgrades, and node reboots.
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""        # empty = cluster default; on microk8s = "microk8s-hostpath"
    # accessMode: ReadWriteOnce because the SBC is single-replica per site.
    accessMode: ReadWriteOnce
  resources:
    requests: { cpu: "500m", memory: "512Mi" }
    limits:   { cpu: "2",    memory: "2Gi"   }
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
      add: [NET_BIND_SERVICE]
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  # SIP-over-TLS server credentials: name of a kubernetes.io/tls Secret
  # (tls.crt = leaf+chain PEM, tls.key) in the release namespace, mounted at
  # /etc/sbc/sip-tls and wired to security.tls_cert_path/tls_key_path. The
  # cert must cover the SIP registrar domain (sbcClientConfig.registrarDomain).
  # Empty = SIP TLS listeners disabled; the daemon serves UDP/TCP only and
  # logs a warning for the configured tls_listen.
  sipTls:
    secretName: ""
  # RFC 8898 Bearer-token REGISTER authorization. When enabled, the daemon
  # rejects REGISTERs that don't carry a valid OIDC access token whose `dn`
  # claim equals the AOR user part — the server-side half of the soft
  # client's OIDC sign-in flow (docs/CLIENT-PROVISIONING-OIDC.md). The JWKS
  # is fetched from the same IdP as sbcClientConfig, trusting
  # sbcClientConfig.extraCaCert when set.
  oidc:
    enabled: false
    # Issuer whose JWKS validates REGISTER tokens. Empty = reuse
    # sbcClientConfig.oidc.issuer (the realm clients authenticate to).
    issuer: ""
    # Audience the SBC requires in the token's `aud`. The Keycloak `sip`
    # scope must add "sbc" to the audience (see Configure-Voice.ps1).
    audience: "sbc"
    # WWW-Authenticate realm in 401 Bearer challenges. Empty = instance name.
    realm: ""
  config:
    max_calls: 5000
    max_registrations: 10000
    media_mode: Relay
    srtp_required: true
    api_listen: "0.0.0.0:80"
    metrics_listen: "0.0.0.0:9090"
    # gRPC admin API — must be distinct from metrics_listen (both default
    # to 9090 in the Rust schema, which collides). sbc-api dials this
    # via the *-grpc ClusterIP Service to push SIP-router refresh RPCs.
    grpc_listen: "0.0.0.0:9091"

kea:
  enabled: true
  image:
    repository: docker.io/jonasal/kea-dhcp4
    tag: "2.6.1"
  resources:
    requests: { cpu: "50m",  memory: "64Mi"  }
    limits:   { cpu: "200m", memory: "256Mi" }
  phone_subnets:
    - subnet:      "10.0.101.0/24"
      pool:        ["10.0.101.50", "10.0.101.250"]
      gateway:     "10.0.101.1"
      # FQDN of the SBC's provisioning HTTP endpoint — TEO TSG accepts FQDN
      # here, so we don't need a stable IP for provisioning.
      tftp_server: "sbc.xtic.dev.mil"
      # DHCP option 6 (domain-name-servers). Point phones at the per-site
      # CoreDNS so they can resolve `sbc.<site>` and `kea.<site>` FQDNs.
      # Coordinates with the sibling coredns-site chart's
      # service.loadBalancerIP.
      dns_servers:
        - "10.0.101.1"
      # VLAN ID for the phone VLAN. Emitted into TEO option 125 (L2QVLAN
      # field) so TSG phones know which 802.1q tag to use after first boot.
      vlan_id: 3001
      # DHCP option 125 (VIVSO) — TEO TSG vendor-specific payload. Helper
      # template builds the hex blob from this subnet's gateway / tftp_server
      # / vlan_id values. Set `enabled: false` for subnets that don't host
      # TEO TSG phones.
      teo_option_125:
        enabled: true

services:
  sip:     { enabled: true }
  api:     { enabled: true }
  metrics: { enabled: true }
