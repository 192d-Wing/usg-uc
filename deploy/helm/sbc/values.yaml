# USG SBC — per-site L3 deployment (Cilium + FQDN-first).
#
# Architecture:
#   - SBC pod gets a Cilium-assigned cluster-pool IP (dynamic per restart)
#   - SBC publishes its FQDN via ExternalDNS (sbc.<site.fqdn_base>) → current pod IP
#   - Phones/trunks/operators all reach SBC by FQDN, NOT by IP
#   - Kea (DHCPv4 server) is exposed via a LoadBalancer Service with a fixed
#     IP from a per-site CiliumLoadBalancerIPPool. This is the one place an
#     IP is required: upstream router `ip helper-address` config is L3-only
#     and can't take an FQDN.
#   - BGP advertises:
#       * The cluster pod CIDR (so any pod is reachable at its IP)
#       * The site's LoadBalancer IP pool (so Kea's LB IP is reachable)
#
# NIST 800-53 Rev5: CM-2 (baseline), CM-6 (settings), SC-7 (boundary).

site:
  name: kfk-001                          # used in resource names
  node: k8-01                            # k8s node hostname for this site
  # FQDN base. Resources publish themselves under this domain via ExternalDNS:
  #   sbc.<fqdn_base>   → SBC SIP/HTTP
  #   kea.<fqdn_base>   → Kea (informational only; DHCP relay still uses IP)
  fqdn_base: "kfk-001.usg.example.com"
  # Per-site LoadBalancer IP pool. Tiny CIDR — only a handful of LB IPs are
  # needed per site (Kea is the main one). Advertised upstream via BGP.
  lb_pool_cidr: "10.50.1.0/28"
  # Fixed LB IP for Kea. Set the upstream router's `ip helper-address` on
  # each phone VLAN's SVI to this address.
  kea_lb_ip: "10.50.1.13"
  # Fixed LB IP for SBC SIP/API ingress. k8s_gateway can't dereference
  # headless Services through Endpoints (it would require a newer plugin
  # version), so SIP/API Services are LoadBalancer-type with a stable LB
  # IP. The FQDN `sbc.<fqdn_base>` resolves to this address.
  sbc_lb_ip: "10.50.1.10"
  # Optional IPv6 anycast for the SIP VIP. When DNS publishes an AAAA for
  # the registrar, soft clients PREFER it — so it must be a real allocated,
  # BGP-advertised address or registration hangs. Both empty = v4-only.
  # lb_pool_cidr6: a v6 block for the pool (e.g. "<prefix>::58/128");
  # sbc_lb_ip6: the SIP Service's address within it.
  lb_pool_cidr6: ""
  sbc_lb_ip6: ""

bgp:
  # Set true on the first chart install per cluster (creates cluster-wide
  # CiliumBGPClusterConfig). Subsequent sites set false.
  install_cluster_config: false
  cluster_asn: 65001
  upstream:
    ip: "10.0.100.1"
    asn: 65000
  # Label value the active CiliumBGPPeerConfig selects advertisements by.
  # Leave as "bgp" when this chart installed the cluster BGP config; set to
  # the existing config's matchLabels value when joining a cluster whose
  # BGP config came from elsewhere (install_cluster_config: false).
  advertise_label: bgp

# ExternalDNS integration. The chart adds standard ExternalDNS hostname
# annotations to Services; ExternalDNS itself is a cluster-wide install
# (see BOOTSTRAP.md). When disabled, the annotations are still emitted but
# inert.
externalDns:
  enabled: true

# Image references use the `localhost/` prefix because kubelet caches
# image-missing state by the exact reference string; after a kubelet
# image-GC sweep (triggered by disk pressure), the bare `sbc-daemon:local`
# reference stays poisoned until kubelite restarts. `localhost/` is the
# default repo containerd applies on `ctr image import` of an unprefixed
# tag, so this is also what `microk8s ctr` already stores under.
image:
  repository: localhost/usg-sbc-daemon
  tag: local
  pullPolicy: Never

# sbc-frontend — operator dashboard (React SPA + nginx). Runs in its own
# Deployment so dashboard releases roll independently of the SBC daemon,
# leaving SIP/RTP untouched. nginx proxies /api/* and /provision/* to the
# daemon's in-cluster ClusterIP Service.
sbcFrontend:
  enabled: true
  replicas: 2                            # rolling update is meaningful at >1
  image:
    repository: localhost/usg-sbc-frontend
    tag: local
    pullPolicy: Never
  resources:
    requests: { cpu: "20m",  memory: "32Mi"  }
    limits:   { cpu: "100m", memory: "128Mi" }

# sbc-postgres — per-site Postgres for SBC config entities. PR1 stores
# directory_numbers here; phones/trunks/dial-plans follow in subsequent
# PRs. Daemon reads SBC_POSTGRES_URL from the secret below.
#
# Production: set `enabled: false` and point `existingSecret.name` at a
# Secret you manage that contains a `dsn` key. (Some teams want managed
# Postgres; this lets them.)
# TLS termination at the edge via Gateway API (Cilium) + cert-manager.
# Opt-in: when enabled the Gateway owns the SBC LoadBalancer IP, terminates
# HTTPS, redirects HTTP->HTTPS, and routes to the frontend nginx (which the
# chart flips to ClusterIP). SIP keeps its own LoadBalancer (Gateway API is
# HTTP-only). Requires the Gateway API CRDs and cert-manager installed.
gateway:
  enabled: false
  className: cilium
  # cert-manager issuer that signs the edge certificate (required when
  # enabled). Kind defaults to ClusterIssuer.
  clusterIssuer: ""
  issuerKind: ClusterIssuer
  # Defaults to sbc.<site.fqdn_base> / <release>-tls if left empty.
  hostname: ""
  tlsSecretName: ""

# Management-plane authentication (sbc-api / sbc-provision). These pods
# are fail-closed: they refuse to start without an admin credential. The
# 00-sbc-auth-secret.yaml template generates and preserves a shared HMAC
# signing key and (if you don't supply one) a random admin password.
auth:
  # Create the auth Secret from this chart. Set false and use
  # existingSecret to manage credentials out-of-band (sealed-secrets/Vault).
  create: true
  # Preferred: a pre-computed argon2 PHC hash (keeps plaintext out of values).
  adminPasswordHash: ""
  # Convenience: a plaintext admin password (hashed by the pod at startup).
  # If both are empty a random password is generated and preserved in the
  # Secret — retrieve it per NOTES.txt.
  adminPassword: ""
  # Reference an externally-managed Secret instead of the generated one.
  # Must contain keys: signing-key, and admin-password-hash OR admin-password.
  existingSecret:
    name: ""

sbcPostgres:
  enabled: true
  image:
    repository: postgres
    tag: "18-alpine"
    pullPolicy: IfNotPresent
  database: sbc
  username: sbc
  # Dev default; override with --set sbcPostgres.password=... or use a
  # values file in CI. NOT a real password in production — set
  # `enabled: false` + `existingSecret` for prod.
  password: sbc-dev-only
  persistence:
    size: 2Gi
    storageClass: ""            # cluster default
  resources:
    requests: { cpu: "50m",  memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
  # When enabled=false, daemon mounts this Secret's `dsn` key as
  # SBC_POSTGRES_URL. Set `name` to enable the external-DSN path.
  existingSecret:
    name: ""
    key: dsn

# sbc-api-server — stand-alone REST API pod (PR5). Owns config-entity
# CRUD directly out of Postgres and proxies everything else to the
# daemon. When enabled, the frontend nginx upstream flips from the
# daemon's API ClusterIP to sbc-api's, so operator/dashboard traffic
# stops sharing a process lifecycle with SIP.
sbcApi:
  enabled: true
  replicas: 2                            # rolling update needs >1
  image:
    repository: localhost/usg-sbc-api-server
    tag: local
    pullPolicy: Never
  resources:
    requests: { cpu: "50m",  memory: "64Mi"  }
    limits:   { cpu: "500m", memory: "256Mi" }
  # Operator OIDC: when issuer+audience are set, sbc-api also accepts the
  # config-admin bearer tokens the central config API takes, so the
  # dashboard authenticates once. The legacy admin login still works.
  # Match the central-config chart's api.oidc.{issuer,audience}.
  oidc:
    issuer: ""
    audience: "usg-uc-config"

# sbc-provision-server — stand-alone phone-provisioning pod (PR6).
# Owns /provision/<MAC>.{cfg,xml}: reads the phone record from Postgres
# and renders the vendor config. When enabled, the frontend nginx
# upstream for /provision/* flips here, so phone provisioning rolls
# independently of the daemon.
sbcProvision:
  enabled: true
  replicas: 2
  image:
    repository: localhost/usg-sbc-provision-server
    tag: local
    pullPolicy: Never
  resources:
    requests: { cpu: "20m",  memory: "32Mi"  }
    limits:   { cpu: "200m", memory: "128Mi" }
  # Source-network restriction for provisioning (decision: phones are
  # gated by source network, not per-device auth). List the phone VLAN
  # CIDRs; the server checks the client IP from nginx's X-Forwarded-For
  # and 403s anything outside them. Empty = app-layer check disabled
  # (rely on the NetworkPolicy / LB source ranges only).
  allowedSourceCidrs: []
    # - "10.0.100.0/24"

# sbc-client-config-server — soft-client discovery + provisioning pod
# (docs/CLIENT-PROVISIONING-OIDC.md). Serves the unauthenticated
# /.well-known/sip-client-config discovery document and the OIDC
# bearer-token-authorized /v1/client-config endpoint (DN, SIP URI,
# POP-scoped registrar domain). Stateless — no database; user identity
# comes from validated token claims. Disabled by default: it needs an
# OIDC issuer (Keycloak realm) to be useful.
sbcClientConfig:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/192d-wing/sbc-client-config-server
    tag: "0.7.0"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: "20m",  memory: "32Mi"  }
    limits:   { cpu: "200m", memory: "128Mi" }
  # Shown by soft clients on the sign-in page.
  serviceName: "USG UC"
  # POP identity — defaults to site.name. Override per site if needed.
  popId: ""
  # Externally visible HTTPS base URL of this POP; becomes
  # provisioning.config_endpoint in the discovery document.
  # Defaults to https://sbc.<site.fqdn_base>. Override for custom ingress.
  publicUrl: ""
  oidc:
    issuer: "https://icam.oopl.dev.mil/realms/dcim"
    # Public PKCE client the soft client uses in the browser flow.
    clientId: "usg-uc-softclient"
    # aud tokens must carry to fetch /v1/client-config.
    audience: "usg-uc-provisioning"
  # SIP domain of user AORs.
  sipDomain: "uc.oopl.dev.mil"
  # POP-scoped registrar domain clients resolve via NAPTR/SRV (RFC 3263).
  # Empty = "sbc.<site.fqdn_base>".
  registrarDomain: ""
  regExpiresSecs: 300
  ttlSecs: 3600
  # Optional extras (empty = omitted from responses).
  voicemailUri: ""
  minVersionDesktop: ""
  minVersionAndroid: ""
  # Hostname for the Traefik Ingress. Defaults to sbc.<site.fqdn_base>.
  # Override when the ingress hostname differs from the FQDN base.
  ingressHost: ""
  # Name of a kubernetes.io/tls Secret (in the release namespace) holding the
  # cert/key for ingressHost. Empty = no tls block on the Ingress (Traefik
  # falls back to its self-signed default cert — soft clients that pin the
  # internal CA will refuse the discovery fetch).
  ingressTlsSecretName: ""
  # PEM-encoded CA certificate(s) to trust when fetching OIDC metadata / JWKS.
  # Required when the IdP uses a private CA (e.g. OOPL Internal CA) that is
  # not in the Mozilla root bundle compiled into the binary.
  # Set to the full PEM block; the chart creates a ConfigMap + volume mount and
  # passes SBC_CLIENT_CONFIG_EXTRA_CA_CERT_FILE to the container.
  # Leave empty to skip (uses Mozilla roots only).
  extraCaCert: |
    -----BEGIN CERTIFICATE-----
    MIIFWzCCA0OgAwIBAgIUNa0tyJb2Dmf4N1uxVUEL+5sFXTIwDQYJKoZIhvcNAQEL
