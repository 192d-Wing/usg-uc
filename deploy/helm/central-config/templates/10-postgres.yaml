{{- if eq (.Values.postgres.mode | default "bundled") "bundled" }}
{{- $pass := required "postgres.password is required in postgres.mode=bundled (no default credential)" .Values.postgres.password }}
{{- if eq $pass "change-me" }}
{{- fail "postgres.password must not be the change-me placeholder" }}
{{- end }}
{{- /* Percent-encoded for the DSN userinfo (QueryEscape, then space as %20). */}}
{{- $passUrl := $pass | urlquery | replace "+" "%20" }}
# Bundled single-instance central Postgres — LAB/DEV ONLY.
#
# Production must use an HA, PITR-backed Postgres: set postgres.mode=cnpg
# (CloudNativePG Cluster, see 11-postgres-cnpg.yaml) or postgres.mode=external.
# This is the one datastore in the system that must not lose writes.
#
# The bundled image has no server certificate, so the DSN below is explicitly
# plaintext (sslmode=disable): lab only. NIST 800-53 Rev5: IA-5 (no default
# authenticator). SC-8 is not met in this mode; in cnpg mode the chart-owned
# DSNs use verify-full, and external DSNs are operator-defined.
# POAM: POA&M-384 (SC-8) bundled mode is plaintext; operator DSN sslmode is not checked.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "central-config.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "central-config.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.user | quote }}
  password: {{ $pass | quote }}
  dsn: "postgres://{{ .Values.postgres.user }}:{{ $passUrl }}@{{ include "central-config.fullname" . }}-postgres.{{ .Release.Namespace }}.svc.cluster.local:5432/{{ .Values.postgres.database }}?sslmode=disable"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "central-config.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "central-config.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "central-config.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "central-config.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "central-config.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "central-config.pgSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "central-config.pgSelectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "central-config.fullname" . }}-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "central-config.fullname" . }}-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "central-config.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "central-config.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "central-config.pgSelectorLabels" . | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
{{- end }}
