{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "central-config.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "central-config.labels" . | nindent 4 }}
---
{{- end }}
# central-config-api — operator write surface + per-site sync read surface.
#
# Writes the central, site_code-sharded Postgres and serves it back to the
# fleet. Stateless and horizontally scalable; the database is the source
# of truth. It never talks to the SIP daemons — sites pull and apply on
# their own via sbc-config-sync.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "central-config.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "central-config.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "central-config.apiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "central-config.apiSelectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "central-config.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: central-config-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CENTRAL_API_LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.api.listenPort }}"
            {{- include "central-config.dsnEnv" . | nindent 12 }}
            - name: CENTRAL_OIDC_ISSUER
              value: {{ required "api.oidc.issuer is required" .Values.api.oidc.issuer | quote }}
            - name: CENTRAL_OIDC_AUDIENCE
              value: {{ .Values.api.oidc.audience | quote }}
            {{- if .Values.api.oidc.extraCaCert }}
            - name: CENTRAL_OIDC_EXTRA_CA_CERT_FILE
              value: "/etc/ssl/extra-ca/ca.pem"
            {{- end }}
            {{- with .Values.api.auditPath }}
            # Optional hash-chained audit file (fail-closed when set). Must be
            # on a writable volume. NIST: AU-9
            - name: CENTRAL_API_AUDIT_PATH
              value: {{ . | quote }}
            {{- end }}
          ports:
            - { name: http, containerPort: {{ .Values.api.listenPort }}, protocol: TCP }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
            # readyz may spend up to ~1s bounding a down-replica probe.
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # NET_BIND_SERVICE added so the setcap'd binary (file capability)
            # can still exec under no_new_privs and bind :80 as non-root.
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          {{- $pgCa := eq (.Values.postgres.mode | default "bundled") "cnpg" }}
          {{- if or .Values.api.oidc.extraCaCert $pgCa }}
          volumeMounts:
            {{- if .Values.api.oidc.extraCaCert }}
            - { name: extra-ca, mountPath: /etc/ssl/extra-ca, readOnly: true }
            {{- end }}
            {{- if $pgCa }}
            # CNPG server CA for sslmode=verify-full (NIST 800-53 Rev5: SC-8)
            - { name: pg-ca, mountPath: /etc/central-config/pg-ca, readOnly: true }
            {{- end }}
          {{- end }}
      {{- if or .Values.api.oidc.extraCaCert $pgCa }}
      volumes:
        {{- if .Values.api.oidc.extraCaCert }}
        - name: extra-ca
          configMap:
            name: {{ include "central-config.fullname" . }}-oidc-ca
        {{- end }}
        {{- if $pgCa }}
        - name: pg-ca
          secret:
            secretName: {{ include "central-config.cnpgCaSecret" . }}
            items:
              - { key: ca.crt, path: ca.crt }
        {{- end }}
      {{- end }}
{{- if .Values.api.oidc.extraCaCert }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "central-config.fullname" . }}-oidc-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "central-config.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  ca.pem: |
    {{- .Values.api.oidc.extraCaCert | nindent 4 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "central-config.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "central-config.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "central-config.apiSelectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
