name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation is counter-productive in CI (cold target dirs,
  # bloats the cache) — disable it.
  CARGO_INCREMENTAL: "0"
  # CI only needs pass/fail, not full debuginfo. Trimming it is a measurable
  # compile-time and cache-size win across the whole workspace.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: "0"
  # No blanket `-D warnings`: the lint gate is the `deny`-level clippy groups
  # (clippy::all + pedantic) configured in the workspace Cargo.toml. Warn-level
  # lints (nursery, unwrap/expect/panic, missing_docs) stay visible without
  # failing the build.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev protobuf-compiler
      # Swatinem caches ~/.cargo + target across runs (and degrades gracefully
      # when the GitHub cache backend is unavailable). Clippy is the canonical
      # "does the whole workspace type-check" job — no separate build job
      # needed, since `cargo test` below compiles every target too.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - run: cargo clippy --all-targets --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # nextest runs the test suite faster than `cargo test` (better
      # parallelism, no per-binary startup). It skips doctests, so run those
      # separately. Compiling the tests here also covers the "does it build"
      # signal the old standalone build job provided.
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --workspace --all-features --doc

  # Locks in portability of the shared client core for the native-client
  # migration (docs/CLIENT-NATIVE-MIGRATION-PLAN.md, Phase 0): the FFI crate
  # and everything below it must keep compiling for mobile targets.
  client-cross:
    name: Client cross-target (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-ios
            os: macos-latest
          - target: aarch64-apple-ios-sim
            os: macos-latest
          - target: aarch64-linux-android
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Target caching matters most here: these jobs' bottleneck is the
      # C/C++ deps (aws-lc-fips, oboe) that Swatinem caches in target/.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cross-${{ matrix.target }}
      # aws-lc-fips-sys builds the FIPS module with Go; macOS runners do not
      # ship it on PATH (ubuntu/windows do).
      - uses: actions/setup-go@v5
        if: runner.os == 'macOS'
        with:
          go-version: stable
          cache: false
      - name: Configure Android NDK toolchain
        if: contains(matrix.target, 'android')
        run: |
          PREBUILT="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$PREBUILT/bin/aarch64-linux-android26-clang"
            echo "CC_aarch64_linux_android=$PREBUILT/bin/aarch64-linux-android26-clang"
            echo "CXX_aarch64_linux_android=$PREBUILT/bin/aarch64-linux-android26-clang++"
            echo "AR_aarch64_linux_android=$PREBUILT/bin/llvm-ar"
            # aws-lc-(fips-)sys generates bindings with the host libclang,
            # which needs the Android sysroot spelled out or it fails on
            # missing libc headers (stdlib.h).
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$PREBUILT/sysroot --target=aarch64-linux-android26"
            echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME"
          } >> "$GITHUB_ENV"
      - run: cargo check -p client-ffi --target ${{ matrix.target }}

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - run: cargo doc --no-deps --all-features

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # Post-merge only: llvm-cov instruments the whole graph (its own cache,
    # no artifact reuse with the regular build) and is the single heaviest
    # job. Keeping it off PRs removes it from PR latency; main still tracks
    # coverage on every merge.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          flags: unit
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
