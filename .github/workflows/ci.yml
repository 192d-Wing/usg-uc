name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation is counter-productive in CI (cold target dirs,
  # bloats the cache) — disable it.
  CARGO_INCREMENTAL: "0"
  # CI only needs pass/fail, not full debuginfo. Trimming it is a measurable
  # compile-time and cache-size win across the whole workspace.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: "0"
  # No blanket `-D warnings`: the lint gate is the `deny`-level clippy groups
  # (clippy::all + pedantic) configured in the workspace Cargo.toml. Warn-level
  # lints (nursery, unwrap/expect/panic, missing_docs) stay visible without
  # failing the build.

jobs:
  # Path-scoped CI. The workspace holds three independent stacks on top of a
  # shared core (crates/uc + crates/proto):
  #
  #   sbc    = crates/sbc/**      (daemon, api/provision/config servers, ...)
  #   client = crates/client/**   (soft client core, FFI, Tauri GUI)
  #
  # A PR that touches only one stack cannot change the lint/test outcome of
  # the other, or of the shared core (features are unified with
  # --all-features in every job, and dependency versions live in Cargo.lock,
  # which counts as "shared"). So PRs lint/test only the stacks they touch.
  # Anything that can affect the whole graph — the shared core, workspace
  # manifests, toolchain, this workflow — widens the scope to everything.
  #
  # Pushes to main always run the full workspace so main's status stays an
  # honest signal (e.g. a floating `stable` toolchain landing a new deny
  # lint in a crate no recent PR touched).
  #
  # Mechanism: this job emits a `--exclude <crate>` list derived from
  # `cargo metadata` (no hand-maintained crate lists to drift), which the
  # clippy/test/docs jobs append to their `--workspace` invocation. Jobs are
  # conditioned on `rust == 'true'` rather than on workflow-level `paths:`
  # filters so the `CI OK` gate below is always reported and can be the one
  # required status check.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # true when any Rust job needs to run at all (docs/deploy-only PRs: false)
      rust: ${{ steps.scope.outputs.rust }}
      # true when the client stack is in scope (controls the GTK/WebKit/ALSA
      # system dependencies, which only the client crates need)
      client: ${{ steps.scope.outputs.client }}
      # `--exclude a --exclude b ...` for the out-of-scope crates ('' = all)
      exclude: ${{ steps.scope.outputs.exclude }}
      # true when the sbc stack (incl. deploy/helm) is in scope: gates the
      # helm render/lint job
      sbc: ${{ github.event_name != 'pull_request' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.sbc == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            shared:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - '.cargo/**'
              - 'crates/uc/**'
              - 'crates/proto/**'
              - '.github/workflows/ci.yml'
            sbc:
              - 'crates/sbc/**'
              # Read by sbc tests (chart preflights, realm import, shipped
              # configs) or embedded at build time (central-db migrations via
              # sqlx::migrate!), so a deploy-only change still runs them.
              - 'deploy/central-db/**'
              - 'deploy/helm/**'
              - 'deploy/keycloak/**'
              - 'deploy/config/**'
              - 'deploy/test/**'
            client:
              - 'crates/client/**'
      - name: Compute workspace scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          SHARED: ${{ steps.filter.outputs.shared }}
          SBC: ${{ steps.filter.outputs.sbc }}
          CLIENT: ${{ steps.filter.outputs.client }}
        run: |
          set -euo pipefail
          # Full workspace on push-to-main or when the shared core changed.
          if [[ "$EVENT" != "pull_request" || "$SHARED" == "true" ]]; then
            {
              echo "rust=true"
              echo "client=true"
              echo "exclude="
            } >> "$GITHUB_OUTPUT"
            echo "scope: full workspace"
            exit 0
          fi
          if [[ "$SBC" != "true" && "$CLIENT" != "true" ]]; then
            {
              echo "rust=false"
              echo "client=false"
              echo "exclude="
            } >> "$GITHUB_OUTPUT"
            echo "scope: no Rust changes"
            exit 0
          fi
          # Only app stacks changed: exclude the shared core plus every app
          # stack that did not change. (The shared core still gets *compiled*
          # as a dependency; it just isn't linted/tested again.)
          skip=(uc proto)
          [[ "$SBC"    != "true" ]] && skip+=(sbc)
          [[ "$CLIENT" != "true" ]] && skip+=(client)
          exclude=""
          for group in "${skip[@]}"; do
            for pkg in $(cargo metadata --format-version 1 --no-deps \
                | jq -r --arg g "/crates/$group/" \
                    '.packages[] | select(.manifest_path | contains($g)) | .name'); do
              exclude+=" --exclude $pkg"
            done
          done
          {
            echo "rust=true"
            echo "client=$CLIENT"
            echo "exclude=$exclude"
          } >> "$GITHUB_OUTPUT"
          echo "scope: skipping groups: ${skip[*]}"
          echo "exclude:$exclude"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check
      # SC-13: Rust images must build on glibc so they carry the aws-lc FIPS module.
      - run: ci/check-dockerfiles-fips.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev protobuf-compiler
      - name: Install client system dependencies (GTK/WebKit/ALSA)
        if: needs.changes.outputs.client == 'true'
        run: sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      # Swatinem caches ~/.cargo + target across runs (and degrades gracefully
      # when the GitHub cache backend is unavailable). Clippy is the canonical
      # "does the whole workspace type-check" job — no separate build job
      # needed, since `cargo test` below compiles every target too.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci
      - run: cargo clippy --workspace --all-targets --all-features ${{ needs.changes.outputs.exclude }}
      # Default features (TLS-only client surface, POA&M-322): the step above
      # uses --all-features, which compiles out the not(insecure-transports) code.
      - name: Clippy client crates (default features)
        if: needs.changes.outputs.client == 'true'
        run: cargo clippy -p proto-dtls -p client-types -p client-audio -p client-sip-ua -p client-core -p client-ffi -p client-gui-tauri --all-targets -- -D warnings
      # No ring in any shipped binary, FIPS module in every image binary,
      # no first-party RustCrypto HMAC; third-party sqlx-postgres SCRAM is
      # POA&M-403 (NIST 800-53 Rev5: SC-13, SR-3).
      - name: Crypto dependency check
        env:
          CARGO_TREE_FLAGS: --locked
        run: ci/check-crypto-deps.sh
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.22
      - name: cargo-deny bans
        run: cargo deny --locked check bans

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev protobuf-compiler
      - name: Install client system dependencies (GTK/WebKit/ALSA)
        if: needs.changes.outputs.client == 'true'
        run: sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: nextest
      # nextest runs the test suite faster than `cargo test` (better
      # parallelism, no per-binary startup). It skips doctests, so run those
      # separately. Compiling the tests here also covers the "does it build"
      # signal the old standalone build job provided.
      - run: cargo nextest run --workspace --all-features ${{ needs.changes.outputs.exclude }}
      # `--all-features` turns on `cluster`, which compiles out the
      # not(cluster) gRPC server tests (grpc_server::tests, admin RPC audit).
      # Run the daemon once more with gRPC and without cluster.
      - name: Test sbc-daemon (grpc, cluster off)
        if: ${{ !contains(needs.changes.outputs.exclude, 'sbc-daemon') }}
        run: cargo nextest run -p sbc-daemon --features grpc
      # Default features: runs tls_only_surface.rs and the
      # not(insecure-transports) tests (POA&M-322).
      - name: Test client crates (default features)
        if: needs.changes.outputs.client == 'true'
        run: cargo nextest run -p proto-dtls -p client-types -p client-audio -p client-sip-ua -p client-core -p client-ffi -p client-gui-tauri
      # The compile_fail doctest for MediaSecurity::Plaintext only proves the
      # variant is absent when insecure-rtp is off, i.e. with default features.
      - name: Doctest client-audio (default features)
        if: needs.changes.outputs.client == 'true'
        run: cargo test -p client-audio --doc
      - run: cargo test --workspace --all-features --doc ${{ needs.changes.outputs.exclude }}

  # Chart checks: helm lint plus the helm_render tests (ignored in the test
  # job, which has no helm binary). Helm comes from the official release
  # tarball, pinned by version and sha256; no third-party action.
  # NIST 800-53 Rev5: CM-6 (chart fail-closed preflights), SA-11, SI-7 (pinned sha256)
  helm:
    name: Helm charts
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sbc == 'true'
    permissions:
      contents: read
    env:
      HELM_VERSION: v4.3.2
      HELM_SHA256: d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install helm
        run: |
          set -euo pipefail
          tarball="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/$tarball" "https://get.helm.sh/$tarball"
          echo "${HELM_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helm"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/helm" --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/helm" >> "$GITHUB_PATH"
      - run: helm version
      - name: helm lint
        run: |
          set -euo pipefail
          helm lint deploy/helm/sbc --kube-version 1.30.0 \
            --set sbcApi.ha1Key.existingSecret=x \
            --set sbcPostgres.password=p \
            --set sbcClientConfig.ingressTlsSecretName=ci-edge-tls \
            --set sbcDaemon.grpcMtls.clusterIssuer=ci-issuer
          helm lint deploy/helm/central-config --kube-version 1.30.0 \
            --set api.oidc.issuer=https://idp.example/realms/r \
            --set postgres.password=ci
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev protobuf-compiler
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci
          save-if: false
      - name: helm template tests
        run: cargo test -p sbc-integration-tests --lib helm_render -- --ignored

  # NOTE: the client cross-target portability job lives in its own
  # path-filtered workflow (.github/workflows/client-cross.yml) so it runs only
  # when the client stack / shared libs change, instead of on every PR.

  # Blocking since 2026-10-10 (clean after #136/#137). A new advisory in a
  # transitive dep fails PRs until it is fixed or documented in
  # .cargo/audit.toml.
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit
      - run: cargo audit

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev protobuf-compiler
      - name: Install client system dependencies (GTK/WebKit/ALSA)
        if: needs.changes.outputs.client == 'true'
        run: sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci
      - run: cargo doc --workspace --no-deps --all-features ${{ needs.changes.outputs.exclude }}

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # Post-merge only: llvm-cov instruments the whole graph (its own cache,
    # no artifact reuse with the regular build) and is the single heaviest
    # job. Keeping it off PRs removes it from PR latency; main still tracks
    # coverage on every merge.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev protobuf-compiler
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coverage
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          flags: unit
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Single always-reported status for branch protection. Scoped jobs that
  # were skipped count as passing; a failed or cancelled job fails the gate.
  # Point the required status check at "CI OK" rather than at individual jobs,
  # since those are now skipped for out-of-scope PRs.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    permissions: {}
    if: always()
    needs: [changes, fmt, clippy, test, docs, audit, helm]
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::one or more required jobs failed"
            exit 1
          fi
