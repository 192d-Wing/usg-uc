name: Release Client

# Cuts a soft-client release independently of the SBC images
# (.github/workflows/release-sbc.yml). Produces, and attaches to a GitHub
# Release:
#
#   - the Tauri desktop binary (`sip-softclient`) for Linux x86_64,
#     macOS arm64 and Windows x86_64. tauri.conf.json has bundling off, so
#     this is the bare executable with the UI embedded, not an installer;
#   - the `client-ffi` native libraries the mobile/desktop shells under
#     clients/ consume: iOS device + simulator and macOS arm64 staticlibs
#     (XCFramework inputs), and the Android arm64 .so (jniLibs input).
#
# Release builds use default features only. The dev scripts under clients/
# pass `--features digest-auth` for commercial-provider interop testing;
# production builds are mTLS-only and must not carry it.
#
# Triggers:
#   - a `client-v<semver>` tag (client-v1.2.3) creates a GitHub Release with
#     the artifacts attached;
#   - workflow_dispatch builds the same artifacts and keeps them as workflow
#     artifacts only (no release is created).

on:
  push:
    tags:
      - 'client-v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  desktop:
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            bin: sip-softclient
          - target: aarch64-apple-darwin
            os: macos-latest
            bin: sip-softclient
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: sip-softclient.exe
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev
      # aws-lc-fips-sys builds the FIPS module with Go; macOS runners do not
      # ship it on PATH (ubuntu/windows do).
      - uses: actions/setup-go@v7
        if: runner.os == 'macOS'
        with:
          go-version: stable
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-client-${{ matrix.target }}
      - name: Build
        run: cargo build --release -p client-gui-tauri --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#client-v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || version="${GITHUB_SHA::7}"
          name="sip-softclient-${version}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
          cp LICENSE dist/
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            (cd dist && 7z a "../${name}.zip" .)
          else
            tar -C dist -czf "${name}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: |
            sip-softclient-*.tar.gz
            sip-softclient-*.zip
          if-no-files-found: error

  ffi:
    name: FFI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-ios
            os: macos-latest
            lib: libclient_ffi.a
          - target: aarch64-apple-ios-sim
            os: macos-latest
            lib: libclient_ffi.a
          - target: aarch64-apple-darwin
            os: macos-latest
            lib: libclient_ffi.a
          - target: aarch64-linux-android
            os: ubuntu-24.04
            lib: libclient_ffi.so
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-ffi-${{ matrix.target }}
      - uses: actions/setup-go@v7
        if: runner.os == 'macOS'
        with:
          go-version: stable
          cache: false
      # Same NDK wiring as client-cross.yml: aws-lc-(fips-)sys generates
      # bindings with the host libclang, which needs the Android sysroot
      # spelled out or it fails on missing libc headers.
      - name: Configure Android NDK toolchain
        if: contains(matrix.target, 'android')
        run: |
          PREBUILT="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$PREBUILT/bin/aarch64-linux-android26-clang"
            echo "CC_aarch64_linux_android=$PREBUILT/bin/aarch64-linux-android26-clang"
            echo "CXX_aarch64_linux_android=$PREBUILT/bin/aarch64-linux-android26-clang++"
            echo "AR_aarch64_linux_android=$PREBUILT/bin/llvm-ar"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$PREBUILT/sysroot --target=aarch64-linux-android26"
            echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME"
          } >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release -p client-ffi --target ${{ matrix.target }}
      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#client-v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || version="${GITHUB_SHA::7}"
          name="client-ffi-${version}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" dist/
          cp LICENSE dist/
          tar -C dist -czf "${name}.tar.gz" .
      - uses: actions/upload-artifact@v7
        with:
          name: ffi-${{ matrix.target }}
          path: client-ffi-*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    needs: [desktop, ffi]
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: Soft Client ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: assets/*
