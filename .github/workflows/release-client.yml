name: Release Client

# Cuts a soft-client release independently of the SBC images
# (.github/workflows/release-sbc.yml). Produces, and attaches to a GitHub
# Release:
#
#   - the Tauri desktop binary (`sip-softclient`) for Linux x86_64,
#     macOS arm64 and Windows x86_64. tauri.conf.json has bundling off, so
#     this is the bare executable with the UI embedded, not an installer;
#   - the `client-ffi` native libraries the mobile/desktop shells under
#     clients/ consume: iOS device + simulator and macOS arm64 staticlibs
#     (XCFramework inputs), and the Android arm64 .so (jniLibs input).
#
# Release builds use default features only. The dev scripts under clients/
# pass `--features digest-auth` for commercial-provider interop testing;
# production builds are mTLS-only and must not carry it.
#
# Each release also carries an SPDX SBOM of the source tree, SHA256SUMS, a
# cosign keyless signature bundle (<file>.sigstore.json) for every asset, and
# GitHub build-provenance and SBOM attestations. Verification commands are in
# CONTRIBUTING.md ("Verifying releases").
#
# Triggers:
#   - a `client-v<semver>` tag (client-v1.2.3) creates a GitHub Release with
#     the artifacts attached;
#   - workflow_dispatch builds the same artifacts and keeps them as workflow
#     artifacts only. A release is created only when the run is on a
#     `client-v<semver>` tag (client-v1.2.3, client-v1.2.3-rc.1); any other
#     `client-v*` tag fails the release job.
#
# Tag runs build cold (no rust-cache restore), so a cache written by a
# branch run never reaches a signed release binary.
#
# The `release` job runs in the `release` environment, which must be
# configured in the repo settings: deployment refs limited to tags `sbc-v*`
# and `client-v*`, and required reviewers.

on:
  push:
    tags:
      - 'client-v*'
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time; never cancel a run that may be mid-release.
concurrency:
  group: release-client-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  desktop:
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            bin: sip-softclient
          - target: aarch64-apple-darwin
            os: macos-latest
            bin: sip-softclient
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: sip-softclient.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev
      # aws-lc-fips-sys builds the FIPS module with Go; macOS runners do not
      # ship it on PATH (ubuntu/windows do).
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: runner.os == 'macOS'
        with:
          go-version: stable
          cache: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: github.ref_type != 'tag'
        with:
          shared-key: release-client-${{ matrix.target }}
      - name: Build
        run: cargo build --release -p client-gui-tauri --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#client-v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || version="${GITHUB_SHA::7}"
          name="sip-softclient-${version}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
          cp LICENSE dist/
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            (cd dist && 7z a "../${name}.zip" .)
          else
            tar -C dist -czf "${name}.tar.gz" .
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: |
            sip-softclient-*.tar.gz
            sip-softclient-*.zip
          if-no-files-found: error

  ffi:
    name: FFI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-ios
            os: macos-latest
            lib: libclient_ffi.a
          - target: aarch64-apple-ios-sim
            os: macos-latest
            lib: libclient_ffi.a
          - target: aarch64-apple-darwin
            os: macos-latest
            lib: libclient_ffi.a
          - target: aarch64-linux-android
            os: ubuntu-24.04
            lib: libclient_ffi.so
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: github.ref_type != 'tag'
        with:
          shared-key: release-ffi-${{ matrix.target }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: runner.os == 'macOS'
        with:
          go-version: stable
          cache: false
      # Same NDK wiring as client-cross.yml: aws-lc-(fips-)sys generates
      # bindings with the host libclang, which needs the Android sysroot
      # spelled out or it fails on missing libc headers.
      - name: Configure Android NDK toolchain
        if: contains(matrix.target, 'android')
        run: |
          PREBUILT="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$PREBUILT/bin/aarch64-linux-android26-clang"
            echo "CC_aarch64_linux_android=$PREBUILT/bin/aarch64-linux-android26-clang"
            echo "CXX_aarch64_linux_android=$PREBUILT/bin/aarch64-linux-android26-clang++"
            echo "AR_aarch64_linux_android=$PREBUILT/bin/llvm-ar"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$PREBUILT/sysroot --target=aarch64-linux-android26"
            echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME"
          } >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release -p client-ffi --target ${{ matrix.target }}
      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#client-v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || version="${GITHUB_SHA::7}"
          name="client-ffi-${version}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" dist/
          cp LICENSE dist/
          tar -C dist -czf "${name}.tar.gz" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffi-${{ matrix.target }}
          path: client-ffi-*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    needs: [desktop, ffi]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'client-v')
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Require a client-v<semver> tag
        run: |
          re='^client-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ "$REF_TYPE" != "tag" || ! "$REF_NAME" =~ $re ]]; then
            echo "::error::$REF_NAME is not a client-v<semver> tag; no release"
            exit 1
          fi
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
      # Source tree for the SBOM only; nothing here is built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # SBOM first, so it covers the source tree and not the downloaded
      # binaries.
      - name: Prepare assets directory
        run: mkdir -p assets
      - name: SBOM (SPDX, source tree)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: assets/usg-uc-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.57.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum -- * > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'assets/*'
          create-storage-record: false
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            assets/*.tar.gz
            assets/*.zip
          sbom-path: assets/usg-uc-${{ github.ref_name }}.spdx.json
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Keyless: the certificate binds each signature to this workflow file at
      # the client-v* tag ref (GitHub OIDC).
      - name: Sign assets (cosign keyless)
        working-directory: assets
        run: |
          set -euo pipefail
          for f in *; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Soft Client ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: assets/*
