name: Integration (SIPp)

# End-to-end integration test: build the SBC image and run the deploy/test SIPp
# harness (UAC -> SBC -> UAS) via docker compose.
#
# This is an AUDIO gate: the UAC (-sn uac_pcap) sends real G.711 RTP through the
# SBC, and the job asserts the SBC actually relayed it (relay legs report a
# non-zero forwarded count) — not just that signaling completed. A regression
# that black-holes media fails here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Dockerfile'
      - 'deploy/test/**'
      - '.github/workflows/integration.yml'
  workflow_dispatch:

jobs:
  sipp-audio:
    name: SIPp media relay (audio) test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE: deploy/test/docker-compose.yml
    steps:
      - uses: actions/checkout@v7

      - name: Build image + start SBC and SIPp UAS
        run: docker compose -f "$COMPOSE" up -d --build sbc sipp-uas

      - name: Wait for the SBC to become healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' sbc-test 2>/dev/null || echo starting)
            echo "[$i] sbc health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          echo "ERROR: SBC did not become healthy"
          exit 1

      - name: Run SIPp UAC with real RTP (G.711 pcap) — signaling + media
        run: |
          docker compose -f "$COMPOSE" run --rm sipp-uac \
            172.28.1.10:5060 -sf /scenarios/sipp-uac-media.xml \
            -r 5 -l 10 -m 10 -mi 172.28.2.30 -p 5070 \
            -recv_timeout 10000 -timeout 60s -trace_err

      - name: Assert RTP was actually relayed (audio gate)
        run: |
          logs=$(docker compose -f "$COMPOSE" logs sbc 2>&1)
          echo "$logs" | grep 'RTP relay forwarding media' || true
          if echo "$logs" | grep -q 'RTP relay forwarding media'; then
            echo "PASS: media relayed — RTP forwarded through the SBC."
          else
            echo "FAIL: no RTP forwarded — call media black-holed."
            exit 1
          fi

      - name: SBC + UAS logs on failure
        if: failure()
        run: |
          echo "===== SBC ====="; docker compose -f "$COMPOSE" logs --tail=200 sbc || true
          echo "===== UAS ====="; docker compose -f "$COMPOSE" logs --tail=50 sipp-uas || true

      - name: Teardown
        if: always()
        run: docker compose -f "$COMPOSE" down -v || true

  # Same audio gate, but against the signaling↔media SPLIT topology: sbc-daemon
  # runs signaling-only and drives a separate sbc-media process over gRPC. Proves
  # real RTP crosses the two-process boundary (create_session / set_remote /
  # start_relay driven over gRPC, relay running in sbc-media).
  sipp-audio-split:
    name: SIPp media relay (audio) test — split
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE: deploy/test/docker-compose.split.yml
    steps:
      - uses: actions/checkout@v7

      - name: Build image + start signaling, media, and SIPp UAS
        run: docker compose -f "$COMPOSE" up -d --build sbc-signaling sbc-media sipp-uas

      - name: Wait for the signaling plane to become healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' sbc-signaling 2>/dev/null || echo starting)
            echo "[$i] sbc-signaling health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          echo "ERROR: sbc-signaling did not become healthy"
          exit 1

      - name: Run SIPp UAC with real RTP (G.711 pcap) — across the split
        run: |
          docker compose -f "$COMPOSE" run --rm sipp-uac \
            172.28.1.10:5060 -sf /scenarios/sipp-uac-media.xml \
            -r 5 -l 10 -m 10 -mi 172.28.2.30 -p 5070 \
            -recv_timeout 10000 -timeout 60s -trace_err

      - name: Assert RTP was relayed by the media plane (audio gate)
        run: |
          # The relay runs in sbc-media now, so the forwarding log is there.
          logs=$(docker compose -f "$COMPOSE" logs sbc-media 2>&1)
          echo "$logs" | grep 'RTP relay forwarding media' || true
          if echo "$logs" | grep -q 'RTP relay forwarding media'; then
            echo "PASS: media relayed across the split — RTP forwarded by sbc-media."
          else
            echo "FAIL: no RTP forwarded by sbc-media — split media black-holed."
            exit 1
          fi

      - name: Logs on failure
        if: failure()
        run: |
          echo "===== sbc-signaling ====="; docker compose -f "$COMPOSE" logs --tail=200 sbc-signaling || true
          echo "===== sbc-media ====="; docker compose -f "$COMPOSE" logs --tail=200 sbc-media || true
          echo "===== UAS ====="; docker compose -f "$COMPOSE" logs --tail=50 sipp-uas || true

      - name: Teardown
        if: always()
        run: docker compose -f "$COMPOSE" down -v || true

  # The split, scaled to a POOL: sbc-daemon load-balances calls across TWO
  # sbc-media nodes (distinct IPs). Proves calls DISTRIBUTE — both nodes must
  # relay media — which only works if the daemon per-call steers SDP to the
  # least-loaded node it picked.
  sipp-audio-pool:
    name: SIPp media relay (audio) test — pool (2 nodes)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE: deploy/test/docker-compose.pool.yml
    steps:
      - uses: actions/checkout@v7

      - name: Build image + start signaling, 2 media nodes, and SIPp UAS
        run: docker compose -f "$COMPOSE" up -d --build sbc-signaling sbc-media-1 sbc-media-2 sipp-uas

      - name: Wait for the signaling plane to become healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' sbc-signaling 2>/dev/null || echo starting)
            echo "[$i] sbc-signaling health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          echo "ERROR: sbc-signaling did not become healthy"
          exit 1

      - name: Run SIPp UAC with real RTP (G.711 pcap) — across the pool
        run: |
          docker compose -f "$COMPOSE" run --rm sipp-uac \
            172.28.1.10:5060 -sf /scenarios/sipp-uac-media.xml \
            -r 5 -l 20 -m 20 -mi 172.28.2.30 -p 5070 \
            -recv_timeout 10000 -timeout 60s -trace_err

      - name: Assert BOTH nodes relayed media (calls distributed across the pool)
        run: |
          n1=$(docker compose -f "$COMPOSE" logs sbc-media-1 2>&1 | grep -c 'RTP relay forwarding media' || true)
          n2=$(docker compose -f "$COMPOSE" logs sbc-media-2 2>&1 | grep -c 'RTP relay forwarding media' || true)
          echo "sbc-media-1 relayed: $n1 call(s); sbc-media-2 relayed: $n2 call(s)"
          if [ "$n1" -gt 0 ] && [ "$n2" -gt 0 ]; then
            echo "PASS: calls distributed — both media nodes relayed RTP."
          else
            echo "FAIL: calls did not spread across the pool (n1=$n1 n2=$n2)."
            exit 1
          fi

      - name: Logs on failure
        if: failure()
        run: |
          echo "===== sbc-signaling ====="; docker compose -f "$COMPOSE" logs --tail=200 sbc-signaling || true
          echo "===== sbc-media-1 ====="; docker compose -f "$COMPOSE" logs --tail=100 sbc-media-1 || true
          echo "===== sbc-media-2 ====="; docker compose -f "$COMPOSE" logs --tail=100 sbc-media-2 || true
          echo "===== UAS ====="; docker compose -f "$COMPOSE" logs --tail=50 sipp-uas || true

      - name: Teardown
        if: always()
        run: docker compose -f "$COMPOSE" down -v || true

  # Pool HA: kill one media node MID-RUN and prove new calls survive by routing
  # to the other node. Uses the same 2-node compose. A call that the pool sends
  # to the dead node gets a transport error and is re-routed (health/route-away);
  # subsequently the dead node is skipped — so post-kill calls all land on the
  # survivor, which relays MORE media than it did before the kill.
  sipp-audio-pool-failover:
    name: SIPp media pool — node failover (route-away)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE: deploy/test/docker-compose.pool.yml
    steps:
      - uses: actions/checkout@v7

      - name: Build image + start signaling, 2 media nodes, and SIPp UAS
        run: docker compose -f "$COMPOSE" up -d --build sbc-signaling sbc-media-1 sbc-media-2 sipp-uas

      - name: Wait for the signaling plane to become healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' sbc-signaling 2>/dev/null || echo starting)
            echo "[$i] sbc-signaling health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          echo "ERROR: sbc-signaling did not become healthy"; exit 1

      - name: Warm-up calls (both nodes serve), then record node-1 baseline
        run: |
          docker compose -f "$COMPOSE" run --rm sipp-uac \
            172.28.1.10:5060 -sf /scenarios/sipp-uac-media.xml \
            -r 5 -l 20 -m 20 -mi 172.28.2.30 -p 5070 \
            -recv_timeout 10000 -timeout 60s -trace_err
          before=$(docker compose -f "$COMPOSE" logs sbc-media-1 2>&1 | grep -c 'RTP relay forwarding media' || true)
          echo "node-1 relayed before kill: $before"
          echo "BEFORE=$before" >> "$GITHUB_ENV"

      - name: Kill media node 2
        run: docker compose -f "$COMPOSE" kill sbc-media-2

      - name: Post-kill calls must survive on node 1
        run: |
          docker compose -f "$COMPOSE" run --rm sipp-uac \
            172.28.1.10:5060 -sf /scenarios/sipp-uac-media.xml \
            -r 5 -l 20 -m 20 -mi 172.28.2.30 -p 5070 \
            -recv_timeout 10000 -timeout 60s -trace_err
          after=$(docker compose -f "$COMPOSE" logs sbc-media-1 2>&1 | grep -c 'RTP relay forwarding media' || true)
          echo "node-1 relayed after kill: $after (was $BEFORE)"
          if [ "$after" -gt "$BEFORE" ]; then
            echo "PASS: node 1 took over — post-kill calls routed to the survivor."
          else
            echo "FAIL: node 1 did not take over post-kill calls (before=$BEFORE after=$after)."
            exit 1
          fi

      - name: Logs on failure
        if: failure()
        run: |
          echo "===== sbc-signaling ====="; docker compose -f "$COMPOSE" logs --tail=200 sbc-signaling || true
          echo "===== sbc-media-1 ====="; docker compose -f "$COMPOSE" logs --tail=100 sbc-media-1 || true
          echo "===== sbc-media-2 ====="; docker compose -f "$COMPOSE" logs --tail=100 sbc-media-2 || true

      - name: Teardown
        if: always()
        run: docker compose -f "$COMPOSE" down -v || true
