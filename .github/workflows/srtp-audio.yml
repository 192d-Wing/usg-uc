name: SRTP audio gate

# End-to-end DTLS-SRTP termination gate: runs the real Go sidecar plus two real
# pion-based DTLS-SRTP media peers against the sbc-media-core relay in terminate
# mode and asserts audio crosses the SBC (decrypt-on-ingress / re-encrypt-on-egress).
#
# This is the ONLY test that exercises proto-srtp against a standard SRTP
# implementation (pion/srtp), so it catches wire-interop regressions that
# self-contained unit tests cannot — e.g. a non-standard SRTP KDF.
#
# It also runs the soft client's media stack against the same pion peer
# (client-core `dtls_interop_pion`): MediaSession + DTLS driver for the
# handshake, then client-audio's RTP transmitter/receiver and RTCP session
# with SRTP and SRTCP on the one media socket, in both DTLS roles. That is
# the interop evidence for client DTLS-SRTP (POA&M-324), which is why the
# client media crates are in the path filters below.
#
# Last, it runs two soft-client media stacks through the SBC relay and the
# sidecar for one call (client-integration-tests `dtls_sbc_sidecar`): the call is held for
# 2.5 s with SRTP and SRTCP crossing the SBC, no side may see the DTLS
# association closed meanwhile, and both clients must get close_notify when
# the SBC ends the call. This is the gate for the association lifetime: a
# sidecar that closes the association after the handshake fails it.
on:
  push:
    branches: [main]
    paths:
      - 'crates/proto/proto-dtls/**'
      - 'crates/proto/proto-srtp/**'
      - 'crates/proto/proto-rtp/**'
      - 'crates/uc/uc-crypto/**'
      - 'crates/sbc/sbc-media-core/**'
      - 'crates/sbc/sbc-daemon/**'
      - 'crates/client/client-sip-ua/**'
      - 'crates/client/client-audio/**'
      - 'crates/client/client-core/**'
      - 'crates/client/client-types/**'
      - 'crates/client/client-integration-tests/**'
      - 'sidecar/**'
      - '.github/workflows/srtp-audio.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/proto/proto-dtls/**'
      - 'crates/proto/proto-srtp/**'
      - 'crates/proto/proto-rtp/**'
      - 'crates/uc/uc-crypto/**'
      - 'crates/sbc/sbc-media-core/**'
      - 'crates/sbc/sbc-daemon/**'
      - 'crates/client/client-sip-ua/**'
      - 'crates/client/client-audio/**'
      - 'crates/client/client-core/**'
      - 'crates/client/client-types/**'
      - 'crates/client/client-integration-tests/**'
      - 'sidecar/**'
      - '.github/workflows/srtp-audio.yml'
  workflow_dispatch:

# CodeQL actions/missing-workflow-permissions: this workflow only checks out
# and builds; it never writes to the repo, packages, or PRs.
permissions:
  contents: read

jobs:
  srtp-audio:
    name: SRTP audio (real DTLS-SRTP interop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          check-latest: true

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev protobuf-compiler libasound2-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: srtp-audio

      # The sidecar is built with the FIPS module (it owns the DTLS handshake);
      # the media peer is a plain test tool (pion/srtp), built non-FIPS.
      - name: Build the Go sidecar + DTLS-SRTP media peer
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ( cd sidecar/dtls-terminator && GOFIPS140=v1.26.0 go build -o "$RUNNER_TEMP/bin/sidecar" ./cmd/dtls-terminator )
          ( cd sidecar/srtp-test-peer && go build -o "$RUNNER_TEMP/bin/peer" . )

      # The gate tests are #[ignore]d (they need the built binaries); run them
      # explicitly with the binary paths. Each spawns the sidecar + two peers,
      # drives a terminated call, and asserts both peers recover relayed audio.
      # The prefix `srtp_audio_end_to_end` matches BOTH:
      #   _real  — drives the pipeline in-process (the monolith relay);
      #   _split — drives it over the gRPC MediaController (the signaling↔media
      #            split), so `--features grpc` is required to compile it.
      - name: Run the srtp-audio gates (in-process + split)
        env:
          SIDECAR_BIN: ${{ runner.temp }}/bin/sidecar
          PEER_BIN: ${{ runner.temp }}/bin/peer
        run: cargo test -p sbc-media-core --features grpc srtp_audio_end_to_end -- --ignored --nocapture

      # proto-dtls DtlsAssociation (the soft client's DTLS 1.2 handshake)
      # against pion/dtls through the same peer binary, in both DTLS roles,
      # with SRTP/SRTCP checked in both directions under the exported keys.
      # #[ignore]d like the gates above (needs PEER_BIN). Default features on
      # purpose: that is the feature set the client ships with.
      - name: Run the proto-dtls pion interop (client + server role)
        env:
          PEER_BIN: ${{ runner.temp }}/bin/peer
        run: cargo test -p proto-dtls --test interop_pion -- --ignored --nocapture

      # The soft client's own media stack against the same peer, in both DTLS
      # roles: MediaSession::begin_secure + the DTLS driver task, then
      # client-audio's RtpTransmitter / RtpReceiver (rtcp-mux, DTLS forward
      # sink) / RtcpSession on the same socket after the handoff. #[ignore]d
      # (needs PEER_BIN). Default features on purpose: the shipped feature
      # set (TLS-only, no plaintext RTP). libasound2-dev (installed above) is
      # needed to build client-audio; no audio device is opened.
      - name: Run the soft-client pion interop (client + server role)
        env:
          PEER_BIN: ${{ runner.temp }}/bin/peer
        run: cargo test -p client-core --test dtls_interop_pion -- --ignored --nocapture

      # Two soft-client media stacks (one per DTLS role) on one call through
      # sbc-media-core's terminating relay and the real sidecar: handshakes,
      # 2.5 s of SRTP/SRTCP across the SBC with the associations staying up,
      # then close_notify to both clients when the SBC stops the relay.
      # #[ignore]d (needs SIDECAR_BIN). Default features, as shipped.
      - name: Run the soft-client call through the SBC relay + sidecar
        env:
          SIDECAR_BIN: ${{ runner.temp }}/bin/sidecar
        run: cargo test -p client-integration-tests --test dtls_sbc_sidecar -- --ignored --nocapture
