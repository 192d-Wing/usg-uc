name: Release

# Builds the multi-arch sbc-daemon container image (linux/amd64 + linux/arm64)
# and publishes it. Each architecture is built on a NATIVE runner (no QEMU) —
# important for the heavy aws-lc-fips compile — then merged into a single
# multi-arch manifest.
#
# Base images are pulled from Iron Bank (registry1.dso.mil) using the
# Platform One robot credentials stored as the org secrets REPO1_USER / REPO1.
#
# Triggers:
#   - pushing a semver tag (v1.2.3) cuts a released image tagged with the
#     version (and `latest` on the default branch);
#   - workflow_dispatch builds an on-demand image tagged with the short SHA
#     (handy for validating the Iron Bank / musl build without cutting a tag).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the image to the registry (false = build only)'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  # Output registry/image. Defaults to GHCR; point IMAGE at your Harbor /
  # Platform One project registry to publish there instead.
  IMAGE: ghcr.io/192d-wing/sbc-daemon
  IRONBANK_REGISTRY: registry1.dso.mil

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    outputs:
      pushed: ${{ github.event_name == 'push' || inputs.push }}
    steps:
      - uses: actions/checkout@v6

      - name: Normalize platform name
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      # Iron Bank (base image source). Robot creds live in org secrets
      # REPO1_USER / REPO1.
      - name: Log in to Iron Bank
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IRONBANK_REGISTRY }}
          username: ${{ secrets.REPO1_USER }}
          password: ${{ secrets.REPO1 }}

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' || inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # Build this single architecture natively and push by digest. The final
      # tags are applied later by the `merge` job when it assembles the
      # manifest list.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' || inputs.push }}

      - name: Export digest
        if: ${{ github.event_name == 'push' || inputs.push }}
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ github.event_name == 'push' || inputs.push }}
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest
    runs-on: ubuntu-24.04
    needs: build
    if: ${{ needs.build.outputs.pushed == 'true' }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
