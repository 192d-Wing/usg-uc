# Dependabot version updates (SI-2, SR-3).
# Options: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Base images are pinned as `tag@sha256:digest`; the docker entries bump both.
# Keep the docker `directories` list in step with the Dockerfiles in the tree.

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "actions updates"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/ci/image"
      - "/crates/sbc/central-config-api"
      - "/crates/sbc/central-config-import"
      - "/crates/sbc/sbc-announcement-server"
      - "/crates/sbc/sbc-api-server"
      - "/crates/sbc/sbc-client-config-server"
      - "/crates/sbc/sbc-config-sync"
      - "/crates/sbc/sbc-dashboard"
      - "/crates/sbc/sbc-provision-server"
      - "/crates/sbc/sbc-trunk-agent"
      - "/sidecar/dtls-terminator"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directories:
      - "/sidecar/dtls-terminator"
      - "/sidecar/srtp-test-peer"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/crates/sbc/sbc-dashboard"
    schedule:
      interval: "weekly"
