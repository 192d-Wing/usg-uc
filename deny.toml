# cargo-deny policy (licenses, advisories, bans, sources).
#
# NIST 800-53 Rev5: SR-3 (Supply Chain Controls), SR-4 (Provenance),
# CM-10 (Software Usage Restrictions), RA-5 (Vulnerability Monitoring)
#
# Run: `cargo deny check`. The license allow-list is the set of permissive
# licenses the dependency tree actually uses (as of 0.10.0); adding a crate
# under any other license fails the check until it is reviewed here.

[graph]
all-features = true

[advisories]
# Unmaintained crates fail only when a workspace crate depends on them
# directly; transitive ones (askama -> basic-toml, serde_yaml_ng ->
# unsafe-libyaml) are reported by cargo-audit as warnings and tracked there.
unmaintained = "workspace"
# Keep in step with .cargo/audit.toml; each ignore is justified there.
ignore = [
    "RUSTSEC-2024-0429",
    "RUSTSEC-2024-0370",
    "RUSTSEC-2023-0071",
]

[licenses]
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    # File-level copyleft; used unmodified as a dependency, so no source
    # disclosure obligation for this codebase.
    "MPL-2.0",
    # aws-lc / ring legacy OpenSSL-derived code.
    "OpenSSL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# Crates marked `publish = false` are not license-checked. Every workspace
# crate also inherits the workspace `license` (Apache-2.0).
ignore = true

[bans]
multiple-versions = "warn"
# Workspace crates use versionless `path` dependencies and none is
# published to crates.io, so path wildcards are expected; registry
# dependencies in this tree all carry versions.
wildcards = "allow"
# SR-16: first-party crypto goes through uc-crypto (aws-lc FIPS module).
# The wrappers are the remaining users, each tracked: third-party sqlx-postgres
# Postgres client auth (SCRAM / MD5) is POA&M-403.
# NIST 800-53 Rev5: SC-13, SR-3, CM-7
deny = [
    { crate = "ring", reason = "non-FIPS crypto; use aws-lc-rs (SR-16)" },
    { crate = "hmac", wrappers = ["hkdf", "radius-proto", "sqlx-postgres"], reason = "use uc_crypto::hash (SR-16); sqlx-postgres SCRAM is POA&M-403" },
    { crate = "hkdf", wrappers = ["dbus-secret-service", "sqlx-postgres"], reason = "use uc_crypto::hkdf (SR-16); sqlx-postgres SCRAM is POA&M-403" },
    { crate = "sha2", wrappers = ["dbus-secret-service", "radius-proto", "sqlx-core", "sqlx-macros-core", "sqlx-postgres", "tauri-codegen", "wry", "uc-user-mgmt"], reason = "use uc_crypto (SR-16); uc-user-mgmt SIP digest HA1 is POA&M-110; sqlx-postgres SCRAM is POA&M-403" },
    { crate = "sha1", wrappers = ["tungstenite"], reason = "WebSocket accept key only (RFC 6455), not a security function" },
    { crate = "aes", wrappers = ["dbus-secret-service"], reason = "use uc_crypto::aead (SR-16); Linux keyring transport is POA&M-373" },
    { crate = "aes-gcm", reason = "use uc_crypto::aead (SR-16)" },
    { crate = "cbc", wrappers = ["dbus-secret-service"], reason = "Linux keyring transport only, POA&M-373" },
    { crate = "chacha20poly1305", reason = "not CNSA (SR-16)" },
    { crate = "rsa", reason = "use aws-lc-rs (SR-16)" },
    { crate = "p256", reason = "use uc_crypto / aws-lc-rs (SR-16)" },
    { crate = "p384", reason = "use uc_crypto::ecdsa / ecdh (SR-16)" },
    { crate = "ed25519-dalek", reason = "not CNSA (SR-16)" },
    { crate = "x25519-dalek", reason = "not CNSA (SR-16)" },
    { crate = "blake2", wrappers = ["argon2"], reason = "argon2id admin passwords only, POA&M-402" },
    { crate = "argon2", wrappers = ["uc-auth"], reason = "POA&M-402" },
    { crate = "md5", wrappers = ["proto-sip", "proto-registrar", "radius-proto"], reason = "SIP digest MD5 interop only, POA&M-276" },
    { crate = "md-5", wrappers = ["radius-proto", "sqlx-postgres"], reason = "third-party only; sqlx-postgres MD5 auth is POA&M-403" },
    { crate = "native-tls", wrappers = ["diameter", "ldap3", "tokio-native-tls"], reason = "OpenSSL TLS outside the aws-lc module; only dormant uc-aaa diameter / uc-user-mgmt LDAP features, in no shipped binary; use rustls on cnsa_provider (SR-16)" },
    { crate = "openssl", wrappers = ["native-tls"], reason = "only via native-tls (SR-16)" },
    { crate = "openssl-sys", wrappers = ["native-tls", "openssl"], reason = "only via native-tls (SR-16)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# First-party RADIUS protocol crate (uc-aaa `radius` feature).
allow-git = ["https://github.com/192d-Wing/usg-radius.git"]
